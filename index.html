function openCustodyEntryModal(custodyId, type){
  const c = DB.custodies.find(x=>x.id===custodyId);
  if(!c) return;
  const bal = custodyBalance(custodyId);
  const expAccs = DB.accounts.filter(a=>a.type==='expense' && (a.id==='acc_expense' || a.id==='acc_opex' || a.id==='acc_mkt_commission' || a.code==='5600'));
  const isExpense = type==='expense';
  const isReturn = type==='return';
  const titleMap = {expense:'تسجيل مصروف من العهدة', topup:'تعزيز العهدة', return:'إرجاع من العهدة'};
  const body = `
    ${(isExpense||isReturn)?`<p style="font-size:12px;color:var(--text-muted);margin:0 0 8px 0;">الرصيد الحالي بيد ${esc(c.holderName)}: <b>${money(bal)}</b></p>`:''}
    ${isExpense?`<div class="field"><label>حساب المصروف</label><select id="f_acc">${expAccs.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div>`:''}
    <div class="row2">
      <div class="field"><label>المبلغ *</label><input id="f_amt" type="number" step="0.01" min="0" value="0"></div>
      <div class="field"><label>التاريخ</label><input id="f_date" type="date" value="${todayISO()}"></div>
    </div>
    ${(type==='topup')?`<div class="field"><label>الخزينة / الحساب البنكي المصروف منه</label><select id="f_cashacc">${cashBankOptionsHtml()}</select></div>`:''}
    ${isReturn?`<div class="field"><label>الخزينة / الحساب البنكي المرتجع إليه</label><select id="f_cashacc">${cashBankOptionsHtml()}</select></div>`:''}
    <div class="field"><label>البيان</label><input id="f_memo" placeholder="${isExpense?'مثال: بنزين السيارة':(type==='topup'?'مثال: تعزيز شهري':'مثال: إرجاع باقي العهدة')}"></div>
    ${isExpense?`<div class="field">
      <label>مرفق (إيصال) - اختياري</label>
      <div id="custodyAttachPreview" style="margin-bottom:8px;"></div>
      <input type="file" id="f_attach" accept="image/*,.pdf" onchange="onCustodyAttachSelected(event)">
    </div>`:''}
  `;
  openModal(titleMap[type], body, ()=>{
    const amt = parseFloat(document.getElementById('f_amt').value)||0;
    if(amt<=0){ toast('أدخل مبلغ صحيح'); return false; }
    if((isExpense||isReturn) && amt>bal+0.009){ toast('المبلغ أكبر من رصيد العهدة الحالي ('+money(bal)+')'); return false; }
    const date = document.getElementById('f_date').value || todayISO();
    const memo = document.getElementById('f_memo').value.trim() || (titleMap[type]);
    const accountId = isExpense ? document.getElementById('f_acc').value : null;
    const cashAccEl = document.getElementById('f_cashacc');
    const cashAccountId = cashAccEl ? cashAccEl.value : null;
    if(!checkPeriodLock(date)) return false;
    const attachment = window._newCustodyAttachment;
    const attachmentName = window._newCustodyAttachmentName;
    window._newCustodyAttachment = undefined; window._newCustodyAttachmentName = undefined;
    const entry = { id:uid(), custodyId, type, date, amount:amt, accountId, memo, cashAccountId, attachment, attachmentName, status:'pending', createdAt:Date.now(), createdBy:currentUserName() };
    DB.custodyEntries.push(entry);
    persist('custodyEntries');
    logActivity('custody', CUSTODY_ENTRY_LABELS[type]+' لعهدة '+c.number+' بمبلغ '+money(amt)+' (بانتظار الموافقة)');
    closeModal(); render(); toast('تم الحفظ بانتظار الموافقة');
  });
}
function onCustodyAttachSelected(ev){
  const file = ev.target.files[0];
  if(!file) return;
  if(file.size > 1.5*1024*1024){ toast('حجم الملف كبير جداً - اختر ملف أصغر من 1.5MB'); return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    window._newCustodyAttachment = reader.result;
    window._newCustodyAttachmentName = file.name;
    const preview = document.getElementById('custodyAttachPreview');
    if(preview) preview.innerHTML = `<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface-2);border-radius:8px;">${icon('printer')}<span style="font-size:12.5px;">${esc(file.name)}</span></div>`;
  };
  reader.readAsDataURL(file);
}
function approveCustodyEntry(id){
  if(!requirePerm('approve_expenses','اعتماد حركات العهدة')) return;
  const e = DB.custodyEntries.find(x=>x.id===id);
  if(!e || e.status!=='pending') return;
  if(!checkPeriodLock(e.date)) return;
  const c = DB.custodies.find(x=>x.id===e.custodyId);
  confirmAction('اعتماد الحركة', 'سيتم ترحيل القيد المحاسبي فوراً. هل أنت متأكد؟', ()=>{
    e.status = 'approved'; e.approvedBy = currentUserName(); e.approvedAt = Date.now();
    persist('custodyEntries');
    if(e.type==='issue' || e.type==='topup'){
      postJournal(e.date, e.memo+' - '+c.holderName, [
        {accountId:'acc_custody', debit:e.amount, credit:0},
        {accountId:e.cashAccountId, debit:0, credit:e.amount},
      ], 'custody', e.id);
    }else if(e.type==='expense'){
      postJournal(e.date, e.memo+' - '+c.holderName, [

function rejectCustodyEntry(id){
  if(!requirePerm('approve_expenses','رفض حركات العهدة')) return;
  const e = DB.custodyEntries.find(x=>x.id===id);
  if(!e || e.status!=='pending') return;

    logActivity('custody', 'رفض حركة عهدة');
    closeModal(); render(); toast('تم الرفض');
  });

function deleteCustodyEntry(id){
  if(!requirePerm('delete_invoices','حذف حركات العهدة')) return;
  const e = DB.custodyEntries.find(x=>x.id===id);
  if(!e) return;
  const isApproved = (e.status||'approved')==='approved';
  if(isApproved && !checkPeriodLock(e.date)) return;
  confirmAction('حذف الحركة', isApproved?'الحركة دي معتمدة بالفعل - سيتم عكس القيد المحاسبي بالكامل. هل أنت متأكد؟':'هل تريد حذف هذه الحركة؟', ()=>{
    if(isApproved) removeJournalBySource(e.id);
    if(e.type==='expense'){
      DB.expenses = DB.expenses.filter(x=>x.custodyEntryId!==e.id);
      persist('expenses');
    }
    DB.custodyEntries = DB.custodyEntries.filter(x=>x.id!==id);
    persist('custodyEntries');
    logActivity('custody', 'حذف حركة عهدة');
    closeModal(); render(); toast('تم الحذف');
  });
}
function closeCustody(custodyId){

function getRawMaterialShortages(){
  const demand = {};
  DB.productionOrders.filter(o=>o.status==='pending').forEach(o=>{
    o.materials.forEach(m=>{
      demand[m.productId] = (demand[m.productId]||0) + m.qty;
    });
  });
  const shortages = [];
  Object.keys(demand).forEach(pid=>{
    const p = productById(pid);
    if(!p) return;
    if(p.quantity < demand[pid] - 0.009){
      shortages.push({product:p, needed:demand[pid], available:p.quantity, short:demand[pid]-p.quantity});
    }
  });
  return shortages.sort((a,b)=>b.short-a.short);
}
function renderHealthCheckPage(){
  const checks = [];
  const today = todayISO();

  // 1. Imbalanced journal entries
  const imbalanced = DB.journal.filter(j=>{
    const dr = j.lines.reduce((s,l)=>s+(l.debit||0),0);
    const cr = j.lines.reduce((s,l)=>s+(l.credit||0),0);
    return Math.abs(dr-cr)>0.02;
  });
  checks.push({label:'قيود محاسبية غير متزنة', ok:imbalanced.length===0, detail:imbalanced.length+' قيد فيه فرق بين المدين والدائن', severity:'danger', action:imbalanced.length>0?()=>{ goTo('reports'); reportTab='trial'; render(); }:null});

  // 2. Duplicate auto-posted journal entries (same source posted more than once)
  const bySource = {};
  DB.journal.filter(j=>j.sourceId && ['invoice_main','expense','consign_shipment','tester_handout','consign_report'].includes(j.kind)).forEach(j=>{
    const key = j.sourceId+'|'+j.kind;
    bySource[key] = (bySource[key]||0)+1;
  });
  const dupSources = Object.values(bySource).filter(c=>c>1).length;
  checks.push({label:'قيود مكررة محتملة (نفس المستند اتترحّل أكتر من مرة)', ok:dupSources===0, detail:dupSources+' مستند له أكتر من قيد', severity:'danger'});

  // 3. Overdue invoices
  const overdueInvs = DB.sales.filter(s=>isOverdue(s));
  const overdueTotal = overdueInvs.reduce((s,i)=>s+(i.total-i.paidAmount),0);
  checks.push({label:'فواتير بيع متأخرة عن الاستحقاق', ok:overdueInvs.length===0, detail:overdueInvs.length+' فاتورة بقيمة '+money(overdueTotal), severity:'warning', action:overdueInvs.length>0?()=>goTo('sales'):null});

  // 4. Old pending approvals (>7 days)
  const cutoff = Date.now() - 7*86400000;
  const oldPendingExp = DB.expenses.filter(e=>e.status==='pending' && e.createdAt<cutoff).length;
  const oldPendingShip = DB.consignShipments.filter(s=>s.status==='pending' && s.createdAt<cutoff).length;
  const oldPendingTester = DB.testerHandouts.filter(t=>t.status==='pending' && t.createdAt<cutoff).length;
  const totalOldPending = oldPendingExp+oldPendingShip+oldPendingTester;
  checks.push({label:'موافقات معلّقة من أكتر من أسبوع', ok:totalOldPending===0, detail:totalOldPending+' مستند لسه بانتظار الموافقة (مصروفات: '+oldPendingExp+', أمانة: '+oldPendingShip+', تسترز: '+oldPendingTester+')', severity:'warning'});

  // 5. Negative stock
  const negStock = DB.products.filter(p=>p.quantity<-0.009);
  checks.push({label:'منتجات بكمية سالبة في المخزون', ok:negStock.length===0, detail:negStock.length+' منتج: '+negStock.slice(0,5).map(p=>p.name).join('، '), severity:'danger', action:negStock.length>0?()=>goTo('inventory'):null});

  // 6. Low stock
  const lowStock = DB.products.filter(p=>p.quantity>=0 && p.quantity<=p.reorderLevel);
  checks.push({label:'منتجات وصلت لحد إعادة الطلب', ok:lowStock.length===0, detail:lowStock.length+' منتج محتاج تعيد طلبه', severity:'info', action:lowStock.length>0?()=>goTo('inventory'):null});

  // 6b. Raw material shortages for pending production orders
  const rawShortages = getRawMaterialShortages();
  checks.push({label:'مواد خام ناقصة لأوامر تصنيع معلّقة', ok:rawShortages.length===0, detail:rawShortages.length+' مادة: '+rawShortages.slice(0,5).map(s=>s.product.name+' (ناقص '+fmt(s.short)+')').join('، '), severity:'warning', action:rawShortages.length>0?()=>goTo('production'):null});

  // 7. Customers exceeding credit limit
  const overLimit = DB.customers.filter(c=>c.creditLimit>0 && partyBalance('customer', c.id, 'acc_ar')>c.creditLimit+0.009);
  checks.push({label:'عملاء تخطوا الحد الائتماني', ok:overLimit.length===0, detail:overLimit.length+' عميل: '+overLimit.slice(0,5).map(c=>c.name).join('، '), severity:'warning', action:overLimit.length>0?()=>goTo('customers'):null});

  // 8. Negative consignment balances (data integrity)
  let negConsign = 0;
  DB.customers.forEach(c=>{
    const buckets = [{id:null}, ...(c.branches||[]).map(b=>({id:b.id}))];
    buckets.forEach(bucket=>{
      const map = consignStockMap(c.id, bucket.id);
      Object.values(map).forEach(v=>{ if(v<-0.009) negConsign++; });
    });
  });
  checks.push({label:'أرصدة بضاعة أمانة سالبة (خلل بيانات)', ok:negConsign===0, detail:negConsign+' رصيد سالب مكتشف', severity:'danger'});

  // 9. Backup recency
  let lastBackup = 0, hasFolder = false;
  try{ lastBackup = parseInt(localStorage.getItem('zib_last_backup')||'0'); hasFolder = !!localStorage.getItem('zib_backup_folder_name'); }catch(e){}
  const daysSinceBackup = lastBackup ? Math.floor((Date.now()-lastBackup)/86400000) : null;
  checks.push({label:'نسخة احتياطية حديثة', ok:hasFolder && daysSinceBackup!==null && daysSinceBackup<=3, detail:!hasFolder?'لسه مختارتش مجلد نسخ احتياطي تلقائي':(daysSinceBackup===null?'لسه ماخدتش نسخة بعد':'آخر نسخة كانت من '+daysSinceBackup+' يوم'), severity:'warning', action:()=>goTo('settings')});

  // 10. Period lock status (informational)
  checks.push({label:'قفل الفترات المحاسبية', ok:true, detail:DB.settings.lockDate?'مفعّل حتى '+fmtDate(DB.settings.lockDate):'مش مفعّل حالياً', severity:'info'});

  const dangerCount = checks.filter(c=>!c.ok && c.severity==='danger').length;
  const warningCount = checks.filter(c=>!c.ok && c.severity==='warning').length;
  const allGood = dangerCount===0 && warningCount===0;
  window._healthActions = checks.map(c=>c.action);

  return `
    <div class="stat-grid" style="margin-bottom:16px;">
      <div class="stat-card ${dangerCount>0?'red':'green'}"><div class="lbl">${icon('alert')} مشاكل عاجلة</div><div class="val">${dangerCount}</div></div>
      <div class="stat-card ${warningCount>0?'gold':'green'}"><div class="lbl">تنبيهات</div><div class="val">${warningCount}</div></div>
      <div class="stat-card green"><div class="lbl">الحالة العامة</div><div class="val" style="font-size:15px;">${allGood?'كل حاجة سليمة ✓':'محتاج مراجعة'}</div></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>نتائج الفحص</h2></div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${checks.map((c,ci)=>{
          const color = c.ok ? 'var(--success)' : (c.severity==='danger'?'var(--danger)':(c.severity==='warning'?'#B8862E':'var(--text-muted)'));
          const bg = c.ok ? 'var(--success-bg)' : (c.severity==='danger'?'var(--danger-bg)':(c.severity==='warning'?'var(--warning-bg)':'var(--surface-2)'));
          return `<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:${bg};border-radius:10px;gap:10px;flex-wrap:wrap;">
            <div>
              <div style="font-weight:600;font-size:13.5px;color:${c.ok?'var(--text)':color};">${c.ok?'✓ ':(c.severity==='danger'?'✕ ':'⚠ ')}${c.label}</div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${esc(c.detail)}</div>
            </div>
            ${(!c.ok && c.action)?`<button class="btn btn-outline btn-sm" onclick="window._healthActions[${ci}]()">عرض</button>`:''}
          </div>`;
        }).join('')}
      </div>
      <p style="font-size:11.5px;color:var(--text-muted);margin-top:14px;">الفحص ده بيتحدّث في كل مرة تفتح فيها الصفحة، ومش بيسجل ولا يغيّر أي حاجة في بياناتك.</p>
    </div>
  `;
}

/* ============ AUTO BACKUP TO LOCAL FOLDER ============ */
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('zib_fs_store', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('handles'); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbSet(key, val){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('handles','readwrite');
    tx.objectStore('handles').put(val, key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('handles','readonly');
    const req = tx.objectStore('handles').get(key);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function pickBackupFolder(){
  if(!window.showDirectoryPicker){ toast('متصفحك لا يدعم هذه الميزة - جرب Chrome أو Edge على الكمبيوتر'); return; }
  try{
    const handle = await window.showDirectoryPicker({mode:'readwrite'});
    await idbSet('backupDir', handle);
    try{ localStorage.setItem('zib_backup_folder_name', handle.name); }catch(e){}
    toast('تم اختيار مجلد النسخ الاحتياطي: '+handle.name);
    await runAutoBackup(true);
    render();
  }catch(e){ /* user cancelled the picker - no action needed */ }
}
function buildBackupObject(){
  return {
    products:DB.products, customers:DB.customers, suppliers:DB.suppliers, sales:DB.sales, purchases:DB.purchases,
    returns:DB.returns, quotations:DB.quotations, stockMoves:DB.stockMoves, consignShipments:DB.consignShipments, consignReports:DB.consignReports, testerHandouts:DB.testerHandouts, expenses:DB.expenses, productGroups:DB.productGroups, crmActivities:DB.crmActivities, purchaseOrders:DB.purchaseOrders, warehouses:DB.warehouses, salesReps:DB.salesReps, custodies:DB.custodies, custodyEntries:DB.custodyEntries, boms:DB.boms, productionOrders:DB.productionOrders, landedCosts:DB.landedCosts, comments:DB.comments, accounts:DB.accounts, journal:DB.journal, activityLog:DB.activityLog, settings:DB.settings,
    exportedAt:new Date().toISOString(), version:1
  };
}
async function runAutoBackup(manual){
  try{
    const handle = await idbGet('backupDir');
    if(!handle){ if(manual) toast('اختر مجلد النسخ الاحتياطي أولاً'); return; }
    let perm = await handle.queryPermission({mode:'readwrite'});
    if(perm!=='granted'){
      perm = await handle.requestPermission({mode:'readwrite'});
      if(perm!=='granted'){ if(manual) toast('لم يتم منح إذن الكتابة للمجلد'); return; }
    }
    const fileName = 'zib-auto-backup-'+todayISO()+'.json';
    const fileHandle = await handle.getFileHandle(fileName, {create:true});
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(buildBackupObject(), null, 2));
    await writable.close();
    try{ localStorage.setItem('zib_last_backup', String(Date.now())); }catch(e){}
    if(manual) toast('تم أخذ نسخة احتياطية بنجاح في المجلد المختار');
    if(VIEW==='settings') render();
  }catch(e){ console.error('Auto backup failed', e); if(manual) toast('فشل أخذ النسخة الاحتياطية - جرب تختار المجلد تاني'); }
}
function autoBackupOnLoad(){
  idbGet('backupDir').then(handle=>{
    if(!handle) return;
    let lastBackup = 0;
    try{ lastBackup = parseInt(localStorage.getItem('zib_last_backup')||'0'); }catch(e){}
    const hoursSince = (Date.now()-lastBackup)/3600000;
    if(hoursSince>=20) runAutoBackup(false);
  }).catch(()=>{});
}
function downloadBackup(){
  if(!requirePerm('manage_settings','تنزيل نسخة احتياطية')) return;
  const backup = buildBackupObject();
  const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='zib-backup-'+todayISO()+'.json'; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  logActivity('backup', 'تنزيل نسخة احتياطية');
  toast('تم تنزيل النسخة الاحتياطية');
}

      DB.sales = data.sales||[]; DB.purchases = data.purchases||[]; DB.returns = data.returns||[]; DB.quotations = data.quotations||[];
      DB.stockMoves = data.stockMoves||[]; DB.consignShipments = data.consignShipments||[]; DB.consignReports = data.consignReports||[];
      DB.testerHandouts = data.testerHandouts||[]; DB.expenses = data.expenses||[]; DB.productGroups = data.productGroups||[]; DB.crmActivities = data.crmActivities||[];
      DB.purchaseOrders = data.purchaseOrders||[]; DB.warehouses = data.warehouses||[{id:'wh_main', name:'المخزن الرئيسي', address:''}]; DB.salesReps = data.salesReps||[]; DB.custodies = data.custodies||[]; DB.custodyEntries = data.custodyEntries||[]; DB.boms = data.boms||[]; DB.productionOrders = data.productionOrders||[]; DB.landedCosts = data.landedCosts||[]; DB.comments = data.comments||[];
      DB.accounts = data.accounts||DEFAULT_ACCOUNTS.map(a=>({...a})); DB.journal = data.journal||[];
      DB.activityLog = data.activityLog||[]; DB.settings = data.settings||{companyName:'Z International Beauty', currency:'QAR', taxEnabled:false, taxRate:0};
      ensureDefaultAccounts();
      ['products','customers','suppliers','sales','purchases','returns','quotations','stockMoves','consignShipments','consignReports','testerHandouts','expenses','productGroups','crmActivities','purchaseOrders','warehouses','salesReps','custodies','custodyEntries','boms','productionOrders','landedCosts','comments','accounts','journal','activityLog','settings'].forEach(k=>persist(k));
      logActivity('restore', 'استعادة نسخة احتياطية من ملف');
      closeModal(); usersLoaded=false; render(); toast('تم استعادة النسخة الاحتياطية بنجاح');

  };
  reader.readAsText(file);
}

  if(!requirePerm('manage_settings','إضافة عملة')) return;
  const codeEl = document.getElementById('s_new_curr_code');
  const nameEl = document.getElementById('s_new_curr_name');
  const code = codeEl.value.trim().toUpperCase();
  const name = nameEl.value.trim();
  if(!code || !name){ toast('اكتب رمز واسم العملة'); return; }
  if(code===DB.settings.currency){ toast('دي أصلاً العملة الأساسية للنظام'); return; }
  if(!DB.settings.currencies) DB.settings.currencies = [];
  if(DB.settings.currencies.some(c=>c.code===code)){ toast('العملة دي مضافة بالفعل'); return; }
  DB.settings.currencies.push({code, name});
  persist('settings');
  codeEl.value=''; nameEl.value='';
  render(); toast('تم إضافة العملة');
}
function deleteCurrency(code){
  if(!requirePerm('manage_settings','حذف عملة')) return;
  DB.settings.currencies = (DB.settings.currencies||[]).filter(c=>c.code!==code);
  persist('settings');
  render(); toast('تم الحذف');
}
function saveSettings(){
  if(!requirePerm('manage_settings','تعديل الإعدادات')) return;
  DB.settings.companyName = document.getElementById('s_name').value.trim() || 'Z International Beauty';
  DB.settings.currency = document.getElementById('s_currency').value.trim() || 'EGP';
  const addrEl = document.getElementById('s_address');
  const phoneEl = document.getElementById('s_phone');
  const webEl = document.getElementById('s_website');
  const warehouseEl = document.getElementById('s_warehouse');
  const nextInvEl = document.getElementById('s_next_inv');
  const nextConsignOutEl = document.getElementById('s_next_consign_out');
  if(addrEl) DB.settings.address = addrEl.value.trim();
  if(phoneEl) DB.settings.phone = phoneEl.value.trim();
  if(webEl) DB.settings.website = webEl.value.trim();
  if(warehouseEl) DB.settings.warehouse = warehouseEl.value.trim();
  if(nextInvEl && nextInvEl.value!==''){ DB.settings.nextInvoiceNumber = parseInt(nextInvEl.value)||112001; }
  if(nextConsignOutEl && nextConsignOutEl.value!==''){ DB.settings.nextConsignOutNumber = parseInt(nextConsignOutEl.value)||23; }
  const lockDateEl = document.getElementById('s_lock_date');
  if(lockDateEl){ DB.settings.lockDate = lockDateEl.value || null; }
  const taxEnEl = document.getElementById('s_tax_enabled');
  const taxRateEl = document.getElementById('s_tax_rate');
  if(taxEnEl) DB.settings.taxEnabled = taxEnEl.checked;
  if(taxRateEl) DB.settings.taxRate = parseFloat(taxRateEl.value)||0;
  persist('settings');
  logActivity('settings', 'تحديث بيانات الشركة');
  render(); toast('تم حفظ الإعدادات');
}

/* ============ ONLINE SETUP SCREEN ============ */
const SETUP_SQL = `create table if not exists zib_data (
  key text primary key,
  value jsonb not null,
  updated_at timestamptz default now()
);

alter table zib_data enable row level security;

drop policy if exists "allow all access" on zib_data;
drop policy if exists "authenticated only" on zib_data;

create policy "authenticated only"
on zib_data for all
using (auth.role() = 'authenticated') with check (auth.role() = 'authenticated');

grant usage on schema public to anon, authenticated;
grant select, insert, update, delete on zib_data to anon, authenticated;

create table if not exists zib_users (
  id uuid primary key references auth.users(id) on delete cascade,
  username text unique not null,
  full_name text,
  role text default 'employee',
  permissions jsonb default '{}'::jsonb,
  lang text default 'ar',
  theme text default 'light',
  created_at timestamptz default now()
);

alter table zib_users add column if not exists permissions jsonb default '{}'::jsonb;
alter table zib_users add column if not exists lang text default 'ar';
alter table zib_users add column if not exists theme text default 'light';

alter table zib_users enable row level security;

drop policy if exists "users authenticated" on zib_users;

create policy "users authenticated"
on zib_users for all
using (auth.role() = 'authenticated') with check (auth.role() = 'authenticated');

grant select, insert, update, delete on zib_users to anon, authenticated;

notify pgrst, 'reload schema';`;

function showApp(){
  document.getElementById('app').style.display='flex';
  const s = document.getElementById('setupScreen'); if(s) s.remove();
}
function renderSetupScreen(prefillErr){
  document.getElementById('app').style.display='none';
  let div = document.getElementById('setupScreen');
  if(!div){ div = document.createElement('div'); div.id='setupScreen'; document.body.appendChild(div); }
  div.className = 'setup-wrap';
  div.innerHTML = `
    <div class="setup-card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">
        <div class="brand-mark" style="width:44px;height:44px;">Z</div>
        <div>
          <h1 style="margin:0;font-size:19px;color:var(--primary-dark);">تفعيل النظام أونلاين</h1>
          <div style="font-size:12.5px;color:var(--text-muted);">ربط Z International Beauty بقاعدة بيانات مشتركة (Supabase)</div>
        </div>
      </div>
      <div class="setup-steps">
        <div>1. افتح <b>supabase.com</b> واعمل حساب مجاني بالإيميل، ثم أنشئ مشروع جديد (New Project).</div>
        <div>2. من القائمة الجانبية داخل المشروع افتح <b>SQL Editor</b> والصق الكود التالي واضغط Run:</div>
      </div>
      <textarea class="setup-sql" readonly id="sqlBox">${SETUP_SQL}</textarea>
      <button class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="copySql()">نسخ الكود</button>
      <div class="setup-steps" style="margin-top:18px;">
        <div>3. مهم: روح <b>Authentication → Providers → Email</b> ووقف خاصية <b>Confirm email</b> (عشان تسجيل المستخدمين الجدد يشتغل فوراً بدون تأكيد بريد).</div>
        <div>4. من القائمة الجانبية افتح <b>Project Settings → API</b> (أو Data API).</div>
        <div>5. انسخ <b>Project URL</b> و <b>anon public key</b> والصقهم هنا تحت:</div>
      </div>
      <div class="field"><label>Project URL</label><input id="su_url" placeholder="https://xxxxx.supabase.co"></div>
      <div class="field"><label>anon public API Key</label><input id="su_key" placeholder="eyJhbGciOi..."></div>
      <div id="setupStatus"></div>
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="submitSupaSetup()">${icon('plus')} اختبار وحفظ الاتصال</button>
        <button class="btn btn-outline" onclick="skipToLocalMode()">تخطي - استخدام النظام محلياً على هذا الجهاز فقط</button>
      </div>
      ${prefillErr?`<div class="setup-status err">${esc(prefillErr)}</div>`:''}
    </div>
  `;
}
function copySql(){
  const box = document.getElementById('sqlBox');
  box.select();
  try{ navigator.clipboard.writeText(SETUP_SQL); toast('تم نسخ الكود'); }
  catch(e){ document.execCommand('copy'); toast('تم النسخ'); }
}
async function submitSupaSetup(){
  const url = document.getElementById('su_url').value.trim();
  const key = document.getElementById('su_key').value.trim();
  const statusEl = document.getElementById('setupStatus');
  if(!url || !key){ statusEl.className='setup-status err'; statusEl.textContent='من فضلك أدخل الـ URL والمفتاح'; return; }
  statusEl.className='setup-status'; statusEl.textContent='جارٍ التحقق من الاتصال...';
  try{
    await testSupaConnection(url,key);
    saveSupaConfig(url,key);
    loadAuthSession();
    if(AUTH_SESSION && AUTH_SESSION.access_token){
      await loadAll(); showApp(); render();
    }else{
      renderAuthScreen();
    }
    toast('تم الاتصال بنجاح');
  }catch(e){
    statusEl.className='setup-status err';
    statusEl.textContent='فشل الاتصال: '+e.message+' — تأكد من تنفيذ كود SQL أولاً ومن صحة البيانات';
  }
}
function skipToLocalMode(){
  enableLocalMode();
  showApp();
  loadAll().then(render);
  toast('يعمل النظام محلياً على هذا الجهاز فقط');
}
function openConnectionSettings(){
  renderSetupScreen();
  if(SUPA.url) document.getElementById('su_url').value = SUPA.url;
  if(SUPA.key) document.getElementById('su_key').value = SUPA.key;
}

/* ============ LOGIN / SIGNUP SCREEN ============ */
let authTab = 'login';
function renderAuthScreen(err){
  document.getElementById('app').style.display='none';
  let div = document.getElementById('setupScreen');
  if(!div){ div = document.createElement('div'); div.id='setupScreen'; document.body.appendChild(div); }
  div.className = 'setup-wrap';
  div.innerHTML = `
    <div class="setup-card" style="max-width:420px;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:22px;">
        <div class="brand-mark" style="width:44px;height:44px;">${DB.settings&&DB.settings.logo?`<img src="${DB.settings.logo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`:'Z'}</div>
        <div>
          <h1 style="margin:0;font-size:18px;color:var(--primary-dark);">تسجيل الدخول</h1>
          <div style="font-size:12px;color:var(--text-muted);">Z International Beauty</div>
        </div>
      </div>
      <div class="field"><label>اسم المستخدم</label><input id="au_user" placeholder="username" autocomplete="username"></div>
      <div class="field"><label>كلمة المرور</label><input id="au_pass" type="password" autocomplete="current-password"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="submitLogin()">دخول</button>
      <div id="authStatus"></div>
      ${err?`<div class="setup-status err">${esc(err)}</div>`:''}
      <button class="btn btn-outline btn-sm" style="margin-top:14px;" onclick="openConnectionSettings()">تغيير إعدادات الاتصال بقاعدة البيانات</button>
    </div>
  `;
}
async function submitLogin(){
  const u = document.getElementById('au_user').value.trim();
  const p = document.getElementById('au_pass').value;
  const st = document.getElementById('authStatus');
  if(!u||!p){ st.className='setup-status err'; st.textContent='أدخل اسم المستخدم وكلمة المرور'; return; }
  st.className='setup-status'; st.textContent='جارٍ الدخول...';
  try{
    const data = await authLogin(u,p);
    AUTH_SESSION = { access_token:data.access_token, refresh_token:data.refresh_token, username:data.profile.username, fullName:data.profile.full_name, role:data.profile.role, permissions:data.profile.permissions||{}, lang:data.profile.lang||'ar', theme:data.profile.theme||'light', userId:data.user.id };
    persistAuthSession();
    if(AUTH_SESSION.lang){ LANG = AUTH_SESSION.lang; try{localStorage.setItem('zib_lang',LANG);}catch(e){} applyLangToDom(); }
    if(AUTH_SESSION.theme){ THEME = AUTH_SESSION.theme; try{localStorage.setItem('zib_theme',THEME);}catch(e){} applyThemeToDom(); }
    await loadAll(); logActivity('login', 'تسجيل دخول'); showApp(); render(); toast('أهلاً '+(AUTH_SESSION.fullName||AUTH_SESSION.username));
  }catch(e){ st.className='setup-status err'; st.textContent='فشل الدخول: '+e.message; }
}
async function submitSignup(){
  const u = document.getElementById('au_user').value.trim();
  const name = document.getElementById('au_name').value.trim();
  const p = document.getElementById('au_pass').value;
  const st = document.getElementById('authStatus');
  if(!u||!p){ st.className='setup-status err'; st.textContent='أدخل اسم المستخدم وكلمة المرور'; return; }
  if(p.length<6){ st.className='setup-status err'; st.textContent='كلمة المرور يجب أن تكون 6 أحرف على الأقل'; return; }
  st.className='setup-status'; st.textContent='جارٍ إنشاء الحساب...';
  try{
    const data = await authSignUp(u,p,name,'admin');
    AUTH_SESSION = { access_token:data.access_token, refresh_token:data.refresh_token, username:u, fullName:name||u, role:'admin', userId:data.user.id };
    persistAuthSession();
    await loadAll(); logActivity('signup', 'إنشاء حساب جديد (مسؤول)'); showApp(); render(); toast('تم إنشاء الحساب بنجاح');
  }catch(e){ st.className='setup-status err'; st.textContent='فشل إنشاء الحساب: '+e.message; }
}

/* ============ MODAL ============ */
function openModal(title, bodyHtml, onSave){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" onmousedown="if(event.target===this) closeModal()">
      <div class="modal">
        <div class="modal-head"><h2>${title}</h2><button class="modal-close" onclick="closeModal()">${icon('close')}</button></div>
        <div id="modalBody">${bodyHtml}</div>
        <div class="modal-foot">
          <button class="btn btn-outline" onclick="closeModal()">${t('cancel')}</button>
          <button class="btn btn-primary" id="modalSaveBtn">${t('save')}</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalSaveBtn').onclick = ()=>{
    const btn = document.getElementById('modalSaveBtn');
    if(btn.disabled) return;
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = t('saving')||'...';
    const result = onSave();
    if(result===false){
      btn.disabled = false;
      btn.textContent = originalText;
    }
  };
  window._confirmCallback = null;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function confirmAction(title, msg, onYes){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" onmousedown="if(event.target===this) closeModal()">
      <div class="modal" style="max-width:400px;">
        <div class="modal-head"><h2>${title}</h2><button class="modal-close" onclick="closeModal()">${icon('close')}</button></div>
        <p style="font-size:13.5px;color:var(--text-muted);">${msg}</p>
        <div class="modal-foot">
          <button class="btn btn-outline" onclick="closeModal()">${t('cancel')}</button>
          <button class="btn btn-danger-o" id="confirmYesBtn" style="background:var(--danger);color:#fff;border-color:var(--danger);">${t('confirmDelete')}</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('confirmYesBtn').onclick = ()=>{
    const btn = document.getElementById('confirmYesBtn');
    if(btn.disabled) return;
    btn.disabled = true;
    onYes();
  };
}

/* ============ INIT ============ */
function hideAppLoader(){
  const el = document.getElementById('appLoader');
  if(el) el.classList.add('loader-hidden');
}
async function init(){
  try{
    loadSupaConfig();
    loadLang();
    loadTheme();
    if(!isOnlineConfigured() && !LOCAL_MODE){
      renderSetupScreen();
      return;
    }
    if(isOnlineConfigured() && !LOCAL_MODE){
      loadAuthSession();
      if(!AUTH_SESSION || !AUTH_SESSION.access_token){
        renderAuthScreen();
        return;
      }
      if(AUTH_SESSION.lang){ LANG = AUTH_SESSION.lang; try{localStorage.setItem('zib_lang',LANG);}catch(e){} applyLangToDom(); }
      if(AUTH_SESSION.theme){ THEME = AUTH_SESSION.theme; try{localStorage.setItem('zib_theme',THEME);}catch(e){} applyThemeToDom(); }
      startSessionKeepAlive();
    }
    await loadAll();
    render();
    autoBackupOnLoad();
  } finally {
    hideAppLoader();
  }
}
document.addEventListener('click', (ev)=>{
  if(openDropdownIdx!==null && !ev.target.closest('.topnav-item')){
    closeDropdown();
  }
});
init();
