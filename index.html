      <div class="field"><label>الكمية الفعلية بعد الجرد *</label><input id="f_actual_qty" type="number" step="1" value="${p.quantity}" oninput="updateAdjustDiff(${p.quantity})"></div>
    </div>
    <div id="adjustDiffLine" style="font-size:13px;color:var(--text-muted);margin-bottom:10px;">الفرق: 0</div>
    <div class="field"><label>سبب التسوية</label><textarea id="f_adjust_reason" rows="2" placeholder="مثال: جرد دوري - تلف - فقدان"></textarea></div>
  `;
  openModal('تسوية مخزون: '+p.name, body, ()=>{
    const actualQty = parseFloat(document.getElementById('f_actual_qty').value);
    if(isNaN(actualQty) || actualQty<0){ toast('أدخل كمية صحيحة'); return false; }
    const diff = actualQty - p.quantity;
    if(diff===0){ toast('لا يوجد فرق - الكمية مطابقة بالفعل'); return false; }
    const reason = document.getElementById('f_adjust_reason').value.trim() || 'تسوية جرد';
    const oldQty = p.quantity;
    p.quantity = actualQty;
    persist('products');
    logStockMove(p.id, diff, 'adjustment', '', reason);
    const value = Math.abs(diff) * (p.purchasePrice||0);
    if(value>0){
      if(diff>0){
        postJournal(todayISO(), 'تسوية مخزون (زيادة) - '+p.name+': '+reason, [
          {accountId:'acc_inventory', debit:value, credit:0},
          {accountId:'acc_inv_adj', debit:0, credit:value},
        ], 'manual');
      }else{
        postJournal(todayISO(), 'تسوية مخزون (نقص) - '+p.name+': '+reason, [
          {accountId:'acc_inv_adj', debit:value, credit:0},
          {accountId:'acc_inventory', debit:0, credit:value},
        ], 'manual');
      }
    }
    logActivity('stock_adjust', 'تسوية مخزون '+p.name+' من '+fmt(oldQty)+' إلى '+fmt(actualQty)+' ('+reason+')');
    closeModal(); render(); toast('تم تسجيل التسوية بنجاح');
  });
}
function updateAdjustDiff(oldQty){
  const el = document.getElementById('f_actual_qty');
  const line = document.getElementById('adjustDiffLine');
  if(!el||!line) return;
  const actual = parseFloat(el.value)||0;
  const diff = actual - oldQty;
  line.textContent = 'الفرق: '+(diff>0?'+':'')+fmt(diff);
  line.style.color = diff===0 ? 'var(--text-muted)' : (diff>0?'var(--success)':'var(--danger)');
}

const CRM_STAGES = {

  inactive: {label:'غير نشط', badge:'unpaid'},

let crmFilter = 'all';
function renderCRMPage(){
  const today = todayISO();
  const rows = DB.customers.map(c=>{
    const acts = DB.crmActivities.filter(a=>a.customerId===c.id).sort((a,b)=>b.createdAt-a.createdAt);
    const last = acts[0];
    const stage = c.crmStage || 'lead';
    return {c, stage, lastActivity:last, nextFollowup:c.nextFollowup||null};
  });
  const dueToday = rows.filter(r=>r.nextFollowup && r.nextFollowup<=today);
  const overdue = rows.filter(r=>r.nextFollowup && r.nextFollowup<today);
  const vipCount = rows.filter(r=>r.stage==='vip').length;
  let filtered = rows;
  if(crmFilter==='due') filtered = dueToday;
  else if(crmFilter==='overdue') filtered = overdue;
  else if(CRM_STAGES[crmFilter]) filtered = rows.filter(r=>r.stage===crmFilter);
  filtered = filtered.sort((a,b)=>{
    if(a.nextFollowup && b.nextFollowup) return a.nextFollowup.localeCompare(b.nextFollowup);
    if(a.nextFollowup) return -1;
    if(b.nextFollowup) return 1;
    return a.c.name.localeCompare(b.c.name);

      ${filtered.length===0?emptyState('لا يوجد عملاء في هذا التصنيف','', false):`
      <div class="table-wrap"><table>
        <thead><tr><th>العميل</th><th>المرحلة</th><th>آخر نشاط</th><th>المتابعة القادمة</th><th></th></tr></thead>
        <tbody>${filtered.map(r=>{
          const isOverdueRow = r.nextFollowup && r.nextFollowup<today;

function openAdvanceModal(kind, partyId){

  `;

    if(isCust){
      postJournal(date, memo, [
        {accountId:cashAcc, debit:amt, credit:0},
        {accountId:'acc_cust_adv', debit:0, credit:amt, partyType:'customer', partyId, partyName:party.name},

function deleteBranch(customerId, branchId){
  if(!requirePerm('delete_records','حذف فروع العملاء')) return;
  const cust = customerById(customerId);
  const used = DB.sales.some(s=>s.branchId===branchId);
  if(used){ toast('لا يمكن حذف فرع مرتبط بفواتير موجودة'); return; }
  const b = (cust.branches||[]).find(x=>x.id===branchId);
  confirmAction('حذف الفرع', 'هل تريد حذف هذا الفرع؟', ()=>{
    cust.branches = (cust.branches||[]).filter(x=>x.id!==branchId);
    persist('customers');
    logActivity('branch', 'حذف فرع '+(b?b.name:branchId)+' من العميل '+cust.name);
    openBranchesModal(customerId);
  });
}
function getCustomerStatementData(customerId){
  const cust = customerById(customerId);
  const invs = DB.sales.filter(s=>s.partyId===customerId);
  const totalInvoiced = invs.reduce((s,i)=>s+i.total,0);
  const totalPaid = invs.reduce((s,i)=>s+i.paidAmount,0);
  const groups = {};
  invs.forEach(inv=>{
    const key = inv.branchId || '__main__';
    const label = inv.branchName || 'العنوان الرئيسي (بدون فرع)';
    if(!groups[key]) groups[key] = {label, count:0, invoiced:0, paid:0};
    groups[key].count++;
    groups[key].invoiced += inv.total;
    groups[key].paid += inv.paidAmount;
  });
  const branchRows = Object.values(groups).sort((a,b)=>b.invoiced-a.invoiced);
  return { cust, invs: [...invs].sort((a,b)=>b.createdAt-a.createdAt), totalInvoiced, totalPaid, totalDue: totalInvoiced-totalPaid, branchRows };
}

function openPartyModal(kind, id){
  const isCust = kind==='customers';
  const x = id ? DB[kind].find(p=>p.id===id) : null;
  const body = `
    <div class="field"><label>الاسم *</label><input id="f_name" value="${x?esc(x.name):''}"></div>
    <div class="row2">
      <div class="field"><label>رقم الهاتف</label><input id="f_phone" value="${x?esc(x.phone):''}"></div>
      <div class="field"><label>العنوان</label><input id="f_addr" value="${x?esc(x.address):''}"></div>
    </div>
    ${isCust?`<div class="field"><label>الحد الائتماني (اختياري - 0 = بدون حد)</label><input id="f_credit_limit" type="number" min="0" step="0.01" value="${x&&x.creditLimit?x.creditLimit:0}"></div>`:''}
    <div class="field"><label>ملاحظات</label><textarea id="f_notes" rows="2">${x?esc(x.notes):''}</textarea></div>
  `;
  openModal(x? (isCust?'تعديل عميل':'تعديل مورد') : (isCust?'عميل جديد':'مورد جديد'), body, ()=>{
    const name = document.getElementById('f_name').value.trim();
    if(!name){ toast('من فضلك أدخل الاسم'); return false; }
    const data = { name, phone:document.getElementById('f_phone').value.trim(), address:document.getElementById('f_addr').value.trim(), notes:document.getElementById('f_notes').value.trim() };
    if(isCust){ const clEl = document.getElementById('f_credit_limit'); data.creditLimit = clEl ? (parseFloat(clEl.value)||0) : 0; }
    const doSave = ()=>{
      if(x){ Object.assign(x,data); } else { data.id=uid(); DB[kind].push(data); }
      persist(kind);
      logActivity(x?'party_edit':'party_create', (x?'تعديل ':'إضافة ')+(isCust?'عميل ':'مورد ')+name);
      closeModal(); render(); toast('تم الحفظ بنجاح');
    };
    const dupPhone = data.phone ? DB[kind].find(p=>p.id!==(x?x.id:null) && p.phone && p.phone.trim()===data.phone) : null;
    const dupName = DB[kind].find(p=>p.id!==(x?x.id:null) && p.name.trim().toLowerCase()===name.toLowerCase());
    const dup = dupPhone || dupName;
    if(dup){
      const reason = dupPhone ? 'نفس رقم الهاتف' : 'نفس الاسم';
      confirmAction('تنبيه: بيانات مكررة', 'موجود '+(isCust?'عميل':'مورد')+' تاني اسمه "'+esc(dup.name)+'" بـ'+reason+'. هل تريد الحفظ رغم ذلك؟', doSave);
      return;
    }
    doSave();
  });
}
function deleteParty(kind, id){
  if(!requirePerm('delete_records','حذف العملاء/الموردين')) return;
  const used = (kind==='customers'?DB.sales:DB.purchases).some(i=>i.partyId===id);
  if(used){ toast('لا يمكن حذف هذا السجل لوجود فواتير مرتبطة به'); return; }
  const x = DB[kind].find(p=>p.id===id);
  confirmAction('حذف السجل', 'هل تريد حذف هذا السجل؟', ()=>{
    DB[kind] = DB[kind].filter(p=>p.id!==id);
    persist(kind);
    logActivity('party_delete', 'حذف '+(kind==='customers'?'عميل ':'مورد ')+(x?x.name:id));
    closeModal(); render(); toast('تم الحذف');
  });
}

      ${editInv?`<div style="font-size:12px;color:var(--text-muted);margin-top:6px;">المبلغ المدفوع سابقاً (${money(editInv.paidAmount)}) لن يتأثر بالتعديل — استخدم زر "تحصيل" لإضافة دفعات جديدة.</div>`:''}

    const date = document.getElementById('f_date').value || todayISO();
    const termId = document.getElementById('f_term').value;
    const dueDate = document.getElementById('f_duedate').value || date;
    const rows = Array.from(document.querySelectorAll('#itemRows .item-row:not(.head-row)'));
    const items = [];
    for(const row of rows){
      const sel = row.querySelector('.sel-product');
      const qtyEl = row.querySelector('.inp-qty');
      const priceEl = row.querySelector('.inp-price');
      if(!sel.value) continue;

    if(termId==='consignment' && !editInv){

      closeModal(); consignTab='shipments'; goTo('consignment');
      toast('تم الحفظ بانتظار الموافقة - لن يتحرك المخزون أو الحسابات حتى الاعتماد');
      return;
    }
    if(!checkPeriodLock(date)) return false;
    const subtotal = items.reduce((s,i)=>s+i.total,0);
    const discType = document.getElementById('f_disc_type').value;
    const discValue = parseFloat(document.getElementById('f_disc_value').value)||0;
    const discountAmount = Math.min(subtotal, discType==='percent' ? subtotal*discValue/100 : discValue);
    const taxable = subtotal - discountAmount;
    const taxEnabled = document.getElementById('f_tax_enabled').checked;
    const taxRate = parseFloat(document.getElementById('f_tax_rate').value)||0;
    const taxAmount = taxEnabled ? taxable*taxRate/100 : 0;
    const total = taxable + taxAmount;
    const paid = Math.min(parseFloat(document.getElementById('f_paid').value)||0, total);
    const cashAcc = document.getElementById('f_cashacc') ? document.getElementById('f_cashacc').value : 'acc_cash';
    const advAvail = partyAdvanceBalance('customers', partyId);
    const advUseEl = document.getElementById('f_advUse');

    const party = customerById(partyId);

    if(!editInv && party.creditLimit>0){
      const currentBalance = partyBalance('customer', partyId, 'acc_ar');
      const newBalance = currentBalance + (total - (paid+advUse));
      if(newBalance > party.creditLimit + 0.009){
        if(!confirm('تنبيه: هذا العميل هيتخطى الحد الائتماني المسموح له ('+money(party.creditLimit)+').\nالرصيد الحالي: '+money(currentBalance)+'\nالرصيد المتوقع بعد الفاتورة دي: '+money(newBalance)+'\n\nهل تريد المتابعة رغم ذلك؟')){
          return false;
        }
      }
    }

    let oldSaleItems = null;
    if(editInv){
      oldSaleItems = editInv.items;
      editInv.items.forEach(it=>{ const p = productById(it.productId); if(p) p.quantity += it.qty; });
      removeInvoiceMainEntry(editInv.id);
    }
    items.forEach(it=>{ const p = productById(it.productId); p.quantity -= it.qty; });

    const cost = items.reduce((s,i)=>s+i.qty*(i.cost||0),0);
    const lines = [
      {accountId:'acc_ar', debit:total, credit:0, partyType:'customer', partyId, partyName:party.name},
      {accountId:'acc_sales', debit:0, credit:subtotal-discountAmount},
    ];
    if(taxAmount>0) lines.push({accountId:'acc_vat_out', debit:0, credit:taxAmount});
    if(cost>0){ lines.push({accountId:'acc_cogs', debit:cost, credit:0}); lines.push({accountId:'acc_inventory', debit:0, credit:cost}); }

    let inv;
    if(editInv){
      const oldSnap = { total:editInv.total, dueDate:editInv.dueDate, partyName:editInv.partyName, itemCount:editInv.items.length, termLabel:editInv.termLabel };
      Object.assign(editInv, { partyId, partyName:party.name, date, items, subtotal, discountType:discType, discountValue:discValue, discountAmount, taxEnabled, taxRate, taxAmount, total, paymentTerm:termId, termLabel:termById(termId).label, dueDate, branchId:branchId||null, branchName:branch?branch.name:null, branchAddress:branch?branch.address:null, poNumber, salesRepId:salesRepId||null, salesRepName:rep?rep.name:null });
      if(editInv.paidAmount>total) editInv.paidAmount = total;
      inv = editInv;
      postJournal(date, 'فاتورة بيع '+inv.number+' - '+party.name, lines, 'sale_invoice', inv.id, 'invoice_main');
      const diff = diffSummary(oldSnap, {total, dueDate, partyName:party.name, itemCount:items.length, termLabel:termById(termId).label}, [
        {key:'partyName', label:'العميل'},
        {key:'total', label:'الإجمالي', fmt:v=>money(v||0)},
        {key:'dueDate', label:'تاريخ الاستحقاق', fmt:v=>v?fmtDate(v):'-'},
        {key:'itemCount', label:'عدد الأصناف'},
        {key:'termLabel', label:'شروط الدفع'},
      ]);
      logActivity('sale_edit', 'تعديل فاتورة بيع '+inv.number+(diff?' — '+diff:' - لا توجد تغييرات جوهرية'));
      if(oldSaleItems) oldSaleItems.forEach(it=>{ logStockMove(it.productId, it.qty, 'sale_edit_reverse', inv.number, 'إلغاء فاتورة بيع (تعديل)'); });
      inv.items.forEach(it=>{ logStockMove(it.productId, -it.qty, 'sale_edit', inv.number, 'تعديل فاتورة بيع'); });
    }else{
      inv = { id:uid(), number:nextInvoiceNo(), date, partyId, partyName:party.name, branchId:branchId||null, branchName:branch?branch.name:null, branchAddress:branch?branch.address:null, poNumber, salesRepId:salesRepId||null, salesRepName:rep?rep.name:null, items, subtotal, discountType:discType, discountValue:discValue, discountAmount, taxEnabled, taxRate, taxAmount, total, paidAmount:Math.min(total,paid+advUse), paymentTerm:termId, termLabel:termById(termId).label, dueDate, createdAt:Date.now(), createdBy:currentUserName() };

function onSalePartyChange(selectedBranchId){
  const partyId = document.getElementById('f_party').value;
  const box = document.getElementById('advanceBox');
  const branchSel = document.getElementById('f_branch');
  if(branchSel){
    const cust = partyId ? customerById(partyId) : null;

    branchSel.innerHTML = '<option value="">بدون فرع - العنوان الرئيسي</option>' + branches.map(b=>`<option value="${b.id}" ${b.id===selectedBranchId?'selected':''}>${esc(b.name)}</option>`).join('');

  }else{ box.style.display='none'; box.innerHTML=''; }

function onTermChange(){
  const termEl = document.getElementById('f_term');
  const dateEl = document.getElementById('f_date');
  const dueEl = document.getElementById('f_duedate');
  if(!termEl||!dateEl||!dueEl) return;
  const t = termById(termEl.value);
  if(t.days!=null){ dueEl.value = addDays(dateEl.value||todayISO(), t.days); dueEl.disabled = true; }
  else{ dueEl.disabled = false; }
  const notice = document.getElementById('consignNotice');
  const payFields = document.getElementById('salePayFields');
  if(notice){
    if(t.id==='consignment'){
      notice.style.display = 'block';
      if(payFields) payFields.style.display = 'none';
    }else{
      notice.style.display = 'none';
      if(payFields) payFields.style.display = '';
    }
  }
}

function saveQuickAddProduct(){

      DB.purchases.push(inv);
      postJournal(date, 'فاتورة شراء '+inv.number+' - '+supplier.name, lines, 'purchase_invoice', inv.id, 'invoice_main');
      if(paid>0){
        postJournal(date, 'دفعة عند فاتورة '+inv.number, [
          {accountId:'acc_ap', debit:paid, credit:0, partyType:'supplier', partyId, partyName:supplier.name},
          {accountId:cashAcc, debit:0, credit:paid},
        ], 'purchase_invoice', inv.id, 'payment');
      }
      if(advUse>0){
        postJournal(date, 'استخدام دفعة مقدمة في فاتورة '+inv.number, [
          {accountId:'acc_ap', debit:advUse, credit:0, partyType:'supplier', partyId, partyName:supplier.name},
          {accountId:'acc_supp_adv', debit:0, credit:advUse, partyType:'supplier', partyId, partyName:supplier.name},
        ], 'purchase_invoice', inv.id, 'advance_use');
      }
      logActivity('purchase_create', 'إنشاء فاتورة شراء '+inv.number+' من المورد '+supplier.name+' بقيمة '+money(total));
      inv.items.forEach(it=>{ logStockMove(it.productId, it.qty, 'purchase', inv.number, 'فاتورة شراء'); });
    }
    persist('purchases'); persist('products');
    if(!editInv && poSourceId){
      const po = DB.purchaseOrders.find(x=>x.id===poSourceId);
      if(po){ po.status = 'converted'; persist('purchaseOrders'); logActivity('po', 'تحويل أمر شراء '+po.number+' لفاتورة شراء '+inv.number); }
    }
    closeModal(); render(); toast(editInv?'تم تعديل الفاتورة بنجاح':'تم حفظ فاتورة الشراء');
  });
  if(editInv){
    editInv.items.forEach(()=>{ addItemRow('purchase'); });
    setTimeout(()=>{
      const rows = document.querySelectorAll('#itemRows .item-row:not(.head-row)');
      editInv.items.forEach((it,i)=>{

        row.querySelector('.inp-qty').value = it.qty;
        row.querySelector('.inp-price').value = it.price;

  }else if(window._purchPrefillItems){

    const prefillParty = window._purchPrefillPartyId;
    const partyEl0 = document.getElementById('f_party');

    setTimeout(()=>{
      const rows = document.querySelectorAll('#itemRows .item-row:not(.head-row)');
      prefillItems.forEach((it,i)=>{

function scanBarcodeAdd(inputEl, mode){
  const code = inputEl.value.trim();
  inputEl.value = '';
  if(!code) return;
  const prod = findProductByBarcode(code);
  if(!prod){ toast('لا يوجد منتج بهذا الباركود: '+code); inputEl.focus(); return; }
  const rows = Array.from(document.querySelectorAll('#itemRows .item-row:not(.head-row)'));
  const existing = rows.find(row=>row.querySelector('.sel-product').value===prod.id);
  if(existing){
    const qtyEl = existing.querySelector('.inp-qty');
    qtyEl.value = (parseFloat(qtyEl.value)||0) + 1;
  }else{
    addItemRow(mode);
    const newRows = document.querySelectorAll('#itemRows .item-row:not(.head-row)');
    const row = newRows[newRows.length-1];
    row.querySelector('.sel-product').value = prod.id;
    row.querySelector('.inp-price').value = mode==='purchase' ? prod.purchasePrice : prod.salePrice;
    row.querySelector('.inp-qty').value = 1;
  }
  updateSaleTotals();
  toast('تمت إضافة: '+prod.name);
  inputEl.focus();
}
function addItemRow(kind){

  div.innerHTML = `

function onProductRowChange(rowId){
  const row = document.getElementById(rowId);
  const sel = row.querySelector('.sel-product');
  const opt = sel.selectedOptions[0];
  if(opt && opt.dataset.price){ row.querySelector('.inp-price').value = opt.dataset.price; }
  updateSaleTotals();
}
function updateSaleTotals(){
  let subtotal = 0;
  document.querySelectorAll('#itemRows .item-row:not(.head-row)').forEach(row=>{
    const qty = parseFloat(row.querySelector('.inp-qty').value)||0;
    const price = parseFloat(row.querySelector('.inp-price').value)||0;
    const t = qty*price;
    row.querySelector('.inp-total').textContent = fmt(t);
    subtotal += t;
  });
  const discTypeEl = document.getElementById('f_disc_type');
  const discValEl = document.getElementById('f_disc_value');
  const discType = discTypeEl ? discTypeEl.value : 'amount';
  const discVal = discValEl ? (parseFloat(discValEl.value)||0) : 0;
  const discountAmount = Math.min(subtotal, discType==='percent' ? subtotal*discVal/100 : discVal);
  const taxable = subtotal - discountAmount;
  const taxEnEl = document.getElementById('f_tax_enabled');
  const taxRateEl = document.getElementById('f_tax_rate');
  const taxEnabled = taxEnEl ? taxEnEl.checked : false;
  const taxRate = taxRateEl ? (parseFloat(taxRateEl.value)||0) : 0;
  const taxAmount = taxEnabled ? taxable*taxRate/100 : 0;
  const total = taxable + taxAmount;

  const set = (id,val)=>{ const el = document.getElementById(id); if(el) el.textContent = val; };
  set('subTotalDisp', money(subtotal));
  set('discDisp', money(discountAmount));
  set('taxableDisp', money(taxable));
  set('taxDisp', money(taxAmount));
  set('saleTotalDisp', money(total));
  const currEl = document.getElementById('f_currency');
  const exRateEl = document.getElementById('f_exrate');
  const baseEquivEl = document.getElementById('baseCurrencyEquiv');
  if(currEl && exRateEl && baseEquivEl){
    const isForeign = currEl.value !== DB.settings.currency;
    if(isForeign){
      const rate = parseFloat(exRateEl.value)||1;
      baseEquivEl.style.display = 'block';
      baseEquivEl.textContent = 'يعادل تقريباً: '+money(total*rate)+' '+DB.settings.currency+' (بسعر صرف '+rate+')';
    }else{
      baseEquivEl.style.display = 'none';
    }
  }
  const paidEl = document.getElementById('f_paid');
  const paid = paidEl ? (parseFloat(paidEl.value)||0) : 0;
  const advUseEl = document.getElementById('f_advUse');
  const advUse = advUseEl ? (parseFloat(advUseEl.value)||0) : 0;
  set('saleDueDisp', money(Math.max(0,total-paid-advUse)));
}

function deleteInvoice(kind, id){
  if(!requirePerm('delete_invoices','حذف الفواتير')) return;
  const list0 = DB[kind];
  const inv0 = list0.find(i=>i.id===id);
  if(inv0 && !checkPeriodLock(inv0.date)) return;
  if(inv0 && inv0.fromConsignment){
    toast('دي فاتورة ناتجة من تقرير مبيعات أمانة - لا يمكن حذفها مباشرة. استخدم "مرتجع بضاعة أمانة" من صفحة البيع بالأمانة لو محتاج تصحيح.');
    return;
  }
  confirmAction('حذف الفاتورة', 'سيتم عكس تأثير هذه الفاتورة على المخزون والقيود المحاسبية. هل تريد المتابعة؟', ()=>{
    const list = DB[kind];
    const inv = list.find(i=>i.id===id);
    if(inv){
      inv.items.forEach(it=>{
        const p = productById(it.productId);
        if(p){ p.quantity += (kind==='sales'? it.qty : -it.qty); }
      });
      DB[kind] = list.filter(i=>i.id!==id);
      removeJournalBySource(inv.id);
      persist(kind); persist('products');
      logActivity(kind==='sales'?'sale_delete':'purchase_delete', 'حذف '+(kind==='sales'?'فاتورة بيع ':'فاتورة شراء ')+inv.number+' - '+inv.partyName+' بقيمة '+money(inv.total));
      inv.items.forEach(it=>{ logStockMove(it.productId, (kind==='sales'?it.qty:-it.qty), (kind==='sales'?'sale_delete':'purchase_delete'), inv.number, 'حذف فاتورة'); });
    }
    closeModal(); render(); toast('تم حذف الفاتورة');
  });
}
function openPaymentModal(kind, id){
  const inv = DB[kind].find(i=>i.id===id);
  const due = inv.total - inv.paidAmount;
  const body = `
    <div class="field"><label>الفاتورة</label><input value="${inv.number} - ${esc(inv.partyName)}" disabled></div>
    <div class="row2">
      <div class="field"><label>الإجمالي</label><input value="${money(inv.total)}" disabled></div>
      <div class="field"><label>المتبقي حالياً</label><input value="${money(due)}" disabled></div>
    </div>
    <div class="field"><label>مبلغ التحصيل / الدفع</label><input id="f_amt" type="number" step="0.01" value="${due}"></div>
    <div class="field"><label>الخزينة / الحساب البنكي</label><select id="f_cashacc">${cashBankOptionsHtml()}</select></div>
  `;
  openModal('تسجيل دفعة', body, ()=>{
    const amt = parseFloat(document.getElementById('f_amt').value)||0;
    if(amt<=0){ toast('أدخل مبلغ صحيح'); return false; }
    const cashAcc = document.getElementById('f_cashacc').value;
    const paidNow = Math.min(amt, due);
    inv.paidAmount = Math.min(inv.total, inv.paidAmount+amt);
    const isSale = kind==='sales';
    if(isSale){
      postJournal(todayISO(), 'تحصيل دفعة فاتورة '+inv.number, [
        {accountId:cashAcc, debit:paidNow, credit:0},
        {accountId:'acc_ar', debit:0, credit:paidNow, partyType:'customer', partyId:inv.partyId, partyName:inv.partyName},
      ], 'sale_invoice', inv.id);
    }else{
      postJournal(todayISO(), 'سداد دفعة فاتورة '+inv.number, [
        {accountId:'acc_ap', debit:paidNow, credit:0, partyType:'supplier', partyId:inv.partyId, partyName:inv.partyName},
        {accountId:cashAcc, debit:0, credit:paidNow},
      ], 'purchase_invoice', inv.id);
    }
    persist(kind);
    logActivity('payment', (isSale?'تحصيل دفعة من عميل ':'سداد دفعة لمورد ')+inv.partyName+' - فاتورة '+inv.number+' بمبلغ '+money(paidNow));
    closeModal(); render(); toast('تم تسجيل الدفعة');
  });
}

function returnedQtyForItem(invoiceId, productId){
  return DB.returns.filter(r=>r.originalInvoiceId===invoiceId).reduce((s,r)=>{
    const it = r.items.find(x=>x.productId===productId);
    return s + (it?it.qty:0);
  },0);
}
function openReturnModal(kind, invoiceId){
  const inv = DB[kind].find(i=>i.id===invoiceId);
  if(!inv) return;
  const isSale = kind==='sales';
  const rows = inv.items.map(it=>{
    const already = returnedQtyForItem(invoiceId, it.productId);
    const maxRet = Math.max(0, it.qty - already);
    return {...it, already, maxRet};
  });
  if(rows.every(r=>r.maxRet<=0)){ toast('تم استرجاع كل الأصناف في هذه الفاتورة بالفعل'); return; }
  const body = `
    <p style="font-size:12.5px;color:var(--text-muted);margin-top:0;">فاتورة ${inv.number} - ${esc(inv.partyName)}</p>
    <div class="item-rows" id="retRows">
      <div class="item-row head-row" style="grid-template-columns:2fr 1fr 1fr 1fr;"><div>المنتج</div><div>الكمية الأصلية</div><div>المتاح للإرجاع</div><div>كمية الإرجاع</div></div>
      ${rows.map((r,i)=>`
        <div class="item-row" style="grid-template-columns:2fr 1fr 1fr 1fr;">
          <div>${esc(r.name)}</div>
          <div class="tnum">${fmt(r.qty)}</div>
          <div class="tnum">${fmt(r.maxRet)}</div>
          <div><input type="number" min="0" max="${r.maxRet}" step="1" value="0" class="ret-qty" data-idx="${i}" ${r.maxRet<=0?'disabled':''} oninput="updateReturnTotal()"></div>
        </div>`).join('')}
    </div>
    <div class="tot-line grand" style="margin-top:12px;"><span>إجمالي المرتجع</span><span class="tnum" id="retTotalDisp">${money(0)}</span></div>
  `;
  window._retRows = rows;
  openModal(isSale?'مرتجع مبيعات':'مرتجع مشتريات', body, ()=>{
    const items = [];
    document.querySelectorAll('.ret-qty').forEach(inp=>{
      const idx = parseInt(inp.dataset.idx);
      const qty = parseFloat(inp.value)||0;
      const r = window._retRows[idx];
      if(qty>0){
        if(qty>r.maxRet){ toast('كمية الإرجاع أكبر من المتاح لـ '+r.name); return; }
        items.push({productId:r.productId, name:r.name, qty, price:r.price, cost:r.cost, total:qty*r.price});
      }
    });
    if(items.length===0){ toast('أدخل كمية إرجاع لصنف واحد على الأقل'); return false; }
    if(!isSale){
      for(const it of items){
        const p = productById(it.productId);
        if(p && it.qty>p.quantity){ toast('لا يمكن إرجاع كمية أكبر من المتاح بالمخزون لـ '+it.name); return false; }
      }
    }
    const subtotal = items.reduce((s,i)=>s+i.total,0);
    const taxAmount = inv.taxEnabled ? subtotal*(inv.taxRate||0)/100 : 0;
    const total = subtotal+taxAmount;
    const ret = { id:uid(), number:nextNumber(DB.returns, isSale?'SRET':'PRET'), type:isSale?'sale_return':'purchase_return', originalInvoiceId:inv.id, originalNumber:inv.number, date:todayISO(), partyId:inv.partyId, partyName:inv.partyName, items, subtotal, taxAmount, total, createdAt:Date.now(), createdBy:currentUserName() };
    DB.returns.push(ret);
    items.forEach(it=>{ const p = productById(it.productId); if(p) p.quantity += (isSale? it.qty : -it.qty); });
    items.forEach(it=>{ logStockMove(it.productId, (isSale?it.qty:-it.qty), (isSale?'sale_return':'purchase_return'), ret.number, 'مرتجع على فاتورة '+inv.number); });

    if(isSale){
      const cost = items.reduce((s,i)=>s+i.qty*(i.cost||0),0);
      const lines = [
        {accountId:'acc_sales', debit:subtotal, credit:0},
        {accountId:'acc_ar', debit:0, credit:total, partyType:'customer', partyId:inv.partyId, partyName:inv.partyName},
      ];
      if(taxAmount>0) lines.push({accountId:'acc_vat_out', debit:taxAmount, credit:0});
      if(cost>0){ lines.push({accountId:'acc_inventory', debit:cost, credit:0}); lines.push({accountId:'acc_cogs', debit:0, credit:cost}); }
      postJournal(ret.date, 'مرتجع مبيعات '+ret.number+' - فاتورة '+inv.number, lines, 'sale_return', ret.id, 'return');
    }else{
      const lines = [
        {accountId:'acc_ap', debit:total, credit:0, partyType:'supplier', partyId:inv.partyId, partyName:inv.partyName},
        {accountId:'acc_inventory', debit:0, credit:subtotal},
      ];
      if(taxAmount>0) lines.push({accountId:'acc_vat_in', debit:0, credit:taxAmount});
      postJournal(ret.date, 'مرتجع مشتريات '+ret.number+' - فاتورة '+inv.number, lines, 'purchase_return', ret.id, 'return');
    }
    persist('returns'); persist('products');
    logActivity(isSale?'sale_return':'purchase_return', (isSale?'مرتجع مبيعات ':'مرتجع مشتريات ')+ret.number+' على فاتورة '+inv.number+' بقيمة '+money(total));
    closeModal(); render(); toast('تم تسجيل المرتجع بنجاح');
  });
}
function updateReturnTotal(){
  let subtotal = 0;
  document.querySelectorAll('.ret-qty').forEach(inp=>{
    const idx = parseInt(inp.dataset.idx);
    const qty = parseFloat(inp.value)||0;
    const r = window._retRows[idx];
    subtotal += qty*r.price;
  });
  const el = document.getElementById('retTotalDisp');
  if(el) el.textContent = money(subtotal);
}

  confirmAction('حذف عرض السعر', 'هل تريد حذف عرض السعر هذا؟', ()=>{
    const q = DB.quotations.find(x=>x.id===id);
    DB.quotations = DB.quotations.filter(x=>x.id!==id);
    persist('quotations');
    logActivity('quotation_delete', 'حذف عرض سعر '+(q?q.number:id));
    closeModal(); render(); toast('تم الحذف');
  });
}

/* ============ CONSIGNMENT (البيع بالأمانة) ============ */
function consignStockMap(customerId, branchId){
  branchId = branchId || null;
  const map = {};
  DB.consignShipments.filter(s=>s.customerId===customerId && (s.branchId||null)===branchId && (s.status||'approved')==='approved').forEach(s=>{
    const sign = s.type==='return' ? -1 : 1;
    s.items.forEach(it=>{ map[it.productId] = (map[it.productId]||0) + sign*it.qty; });
  });
  DB.consignReports.filter(r=>r.customerId===customerId && (r.branchId||null)===branchId).forEach(r=>{
    r.items.forEach(it=>{ map[it.productId] = (map[it.productId]||0) - it.qtySold; });
  });
  return map;
}
function consignStockFor(customerId, productId, branchId){ return consignStockMap(customerId, branchId)[productId] || 0; }
function consignCustomerBalances(){
  const result = [];
  DB.customers.forEach(c=>{
    const buckets = [{id:null, name:null}, ...(c.branches||[]).map(b=>({id:b.id, name:b.name}))];
    buckets.forEach(bucket=>{
      const map = consignStockMap(c.id, bucket.id);
      let qty=0, value=0;
      Object.keys(map).forEach(pid=>{
        const q = map[pid];
        if(q>0.001){ const p = productById(pid); qty+=q; value += q*(p?p.purchasePrice:0); }
      });
      if(qty>0.001) result.push({customer:c, branchId:bucket.id, branchName:bucket.name, qty, value, map});
    });
  });
  return result.sort((a,b)=>b.value-a.value);
}

function openConsignBalanceDetail(customerId, branchId){
  const cust = customerById(customerId);
  branchId = branchId || null;
  const branch = branchId ? (cust.branches||[]).find(b=>b.id===branchId) : null;
  const map = consignStockMap(customerId, branchId);
  const rows = Object.keys(map).map(pid=>{ const p = productById(pid); return {p, qty:map[pid]}; }).filter(r=>r.p && r.qty>0.001).sort((a,b)=>b.qty-a.qty);
  const body = rows.length===0 ? `<p style="font-size:12.5px;color:var(--text-muted);">لا توجد بضاعة أمانة متبقية لدى هذا المتجر.</p>` : `

      <tbody>${rows.map(r=>`<tr><td>${esc(r.p.name)}</td><td>${esc(r.p.code)}</td><td class="tnum">${fmt(r.qty)}</td><td class="tnum">${money(r.qty*r.p.purchasePrice)}</td></tr>`).join('')}</tbody>
    </table></div>`;
  openModal('بضاعة الأمانة لدى '+cust.name+(branch?' - '+branch.name:''), body, ()=>{ closeModal(); });
  document.getElementById('modalSaveBtn').style.display='none';
  const cancelBtn = document.querySelector('#modalRoot .modal-foot .btn-outline');
  if(cancelBtn) cancelBtn.textContent = 'إغلاق';
}

function deleteConsignReport(id){
  if(!requirePerm('delete_invoices','حذف تقارير مبيعات الأمانة')) return;
  const rep = DB.consignReports.find(x=>x.id===id);
  if(!rep) return;
  if(!checkPeriodLock(rep.date)) return;
  confirmAction('حذف تقرير المبيعات', 'سيتم حذف فاتورة البيع المرتبطة بهذا التقرير وعكس القيد المحاسبي بالكامل (الكمية المباعة هترجع تاني كرصيد أمانة لدى المتجر). هل أنت متأكد؟', ()=>{
    removeJournalBySource(rep.id);
    const mirrorInv = DB.sales.find(s=>s.consignReportId===rep.id);
    if(mirrorInv){ DB.sales = DB.sales.filter(s=>s.id!==mirrorInv.id); persist('sales'); }
    DB.consignReports = DB.consignReports.filter(x=>x.id!==id);
    persist('consignReports');
    logActivity('consignment', 'حذف تقرير مبيعات أمانة '+rep.number+' - '+rep.customerName);
    closeModal(); render(); toast('تم الحذف بنجاح');
  });
}

function approveConsignShipment(id){
  if(!requirePerm('approve_consignment','اعتماد أذونات بضاعة الأمانة')) return;
  const ship = DB.consignShipments.find(x=>x.id===id);
  if(!ship || ship.status!=='pending') return;
  if(!checkPeriodLock(ship.date)) return;
  const isReturn = ship.type==='return';
  const stockMap = isReturn ? consignStockMap(ship.customerId, ship.branchId||null) : {};
  for(const it of ship.items){
    const p = productById(it.productId);
    if(!p) continue;
    if(isReturn){
      const held = stockMap[it.productId]||0;
      if(it.qty>held+0.001){ toast('لا يمكن الاعتماد: الكمية المرتجعة من "'+it.name+'" أكبر من رصيد الأمانة الحالي ('+fmt(held)+')'); return; }
    }else{
      if(it.qty>p.quantity+0.001){ toast('لا يمكن الاعتماد: الكمية المطلوبة من "'+it.name+'" أكبر من المتاح بالمخزن حالياً ('+fmt(p.quantity)+')'); return; }
    }
  }
  confirmAction('اعتماد '+(isReturn?'المرتجع':'إذن الصرف'), 'سيتم تحريك المخزون وترحيل القيد المحاسبي فوراً. هل أنت متأكد؟', ()=>{
    ship.status = 'approved'; ship.approvedBy = currentUserName(); ship.approvedAt = Date.now();
    persist('consignShipments');
    ship.items.forEach(it=>{
      const p = productById(it.productId);
      p.quantity += isReturn ? it.qty : -it.qty;
      logStockMove(it.productId, isReturn?it.qty:-it.qty, isReturn?'consign_return':'consign_out', ship.number, isReturn?'مرتجع بضاعة أمانة':'صرف بضاعة أمانة');
    });
    persist('products');
    const value = ship.items.reduce((s,it)=>s+it.qty*(it.cost||0),0);
    if(value>0){
      if(isReturn){
        postJournal(ship.date, 'مرتجع بضاعة أمانة '+ship.number+' من '+ship.customerName, [
          {accountId:'acc_inventory', debit:value, credit:0},
          {accountId:'acc_consign_inv', debit:0, credit:value},
        ], 'consign_shipment', ship.id);
      }else{
        postJournal(ship.date, 'صرف بضاعة أمانة '+ship.number+' إلى '+ship.customerName, [
          {accountId:'acc_consign_inv', debit:value, credit:0},
          {accountId:'acc_inventory', debit:0, credit:value},
        ], 'consign_shipment', ship.id);
      }
    }
    logActivity('consignment', 'اعتماد '+(isReturn?'مرتجع بضاعة أمانة ':'إذن صرف بضاعة أمانة ')+ship.number+' - '+ship.customerName);

  });
}

function fixDuplicateApproval(id){
  if(!requirePerm('manage_accounts','إصلاح اعتماد مكرر')) return;
  const ship = DB.consignShipments.find(x=>x.id===id);
  if(!ship){ toast('الإذن غير موجود'); return; }
  const dupJournals = DB.journal.filter(j=>j.sourceId===ship.id && j.sourceType==='consign_shipment');
  if(dupJournals.length<2){ toast('مفيش تكرار مكتشف لهذا الإذن - القيود المرتبطة بيه عدد '+dupJournals.length+' بس'); return; }
  const isReturn = ship.type==='return';
  const extraCount = dupJournals.length - 1;
  const itemsList = ship.items.map(it=>'• '+it.name+': '+fmt(it.qty*extraCount)+' وحدة').join('\n');
  confirmAction('إصلاح اعتماد مكرر - '+ship.number,
    'لقينا '+dupJournals.length+' قيود مكررة لنفس الإذن (المفروض قيد واحد بس). هيتم:\n- حذف '+extraCount+' من القيود الزيادة (والإبقاء على واحد)\n- تصحيح كمية المخزون للمنتجات دي:\n'+itemsList+'\nهل أنت متأكد؟',
    ()=>{
      for(let i=0;i<extraCount;i++){
        const j = dupJournals[i];
        DB.journal = DB.journal.filter(x=>x.id!==j.id);
      }
      persist('journal');
      ship.items.forEach(it=>{
        const p = productById(it.productId);
        if(!p) return;
        const correction = it.qty * extraCount;
        p.quantity += isReturn ? -correction : correction;
        logStockMove(it.productId, isReturn?-correction:correction, 'duplicate_fix', ship.number, 'تصحيح اعتماد مكرر لإذن بضاعة أمانة');
      });
      persist('products');
      logActivity('consignment', 'إصلاح اعتماد مكرر لإذن '+ship.number+' - حذف '+extraCount+' قيد زيادة وتصحيح المخزون');
      closeModal(); render(); toast('تم الإصلاح بنجاح - راجع الأرقام للتأكد');
    });
}
function deleteConsignShipment(id){
  if(!requirePerm('delete_invoices','حذف أذونات بضاعة الأمانة')) return;
  const ship = DB.consignShipments.find(x=>x.id===id);
  if(!ship) return;
  const isApproved = (ship.status||'approved')==='approved';
  if(isApproved && !checkPeriodLock(ship.date)) return;
  if(isApproved && ship.type==='out'){
    const shipBranch = ship.branchId||null;
    const mapWithout = {};
    DB.consignShipments.filter(s=>s.customerId===ship.customerId && (s.branchId||null)===shipBranch && s.id!==ship.id && (s.status||'approved')==='approved').forEach(s=>{
      const sign = s.type==='return' ? -1 : 1;
      s.items.forEach(it=>{ mapWithout[it.productId] = (mapWithout[it.productId]||0) + sign*it.qty; });
    });
    DB.consignReports.filter(r=>r.customerId===ship.customerId && (r.branchId||null)===shipBranch).forEach(r=>{
      r.items.forEach(it=>{ mapWithout[it.productId] = (mapWithout[it.productId]||0) - it.qtySold; });
    });
    for(const key in mapWithout){
      if(mapWithout[key]<-0.001){ toast('لا يمكن الحذف: تم بيع أو إرجاع جزء من هذه الشحنة بالفعل عبر تقارير مبيعات أو مرتجعات لاحقة'); return; }
    }
  }
  const msg = isApproved
    ? 'الإذن ده معتمد ومترحّل بالفعل — سيتم عكس أثره على المخزون وحذف القيد المحاسبي بالكامل. هل أنت متأكد؟'
    : 'هل تريد حذف هذا الإذن نهائياً؟';
  confirmAction('حذف '+(ship.type==='return'?'المرتجع':'إذن الصرف'), msg, ()=>{
    if(isApproved){
      const isReturn = ship.type==='return';
      ship.items.forEach(it=>{
        const p = productById(it.productId);
        if(p) p.quantity += isReturn ? -it.qty : it.qty;
        logStockMove(it.productId, isReturn?-it.qty:it.qty, 'consign_delete', ship.number, 'حذف '+(isReturn?'مرتجع':'إذن صرف')+' بضاعة أمانة');
      });
      persist('products');
      removeJournalBySource(ship.id);
    }
    DB.consignShipments = DB.consignShipments.filter(x=>x.id!==id);
    persist('consignShipments');
    logActivity('consignment', 'حذف '+(ship.type==='return'?'مرتجع':'إذن صرف')+' بضاعة أمانة '+ship.number+' - '+ship.customerName);
    closeModal(); render(); toast('تم الحذف بنجاح');
  });
}

  confirmAction('اعتماد التوزيع', 'سيتم تحريك المخزون وترحيل قيد المصروف فوراً. هل أنت متأكد؟', ()=>{
    th.status = 'approved'; th.approvedBy = currentUserName(); th.approvedAt = Date.now();
    persist('testerHandouts');
    th.items.forEach(it=>{
      const p = productById(it.productId);
      p.quantity -= it.qty;
      logStockMove(it.productId, -it.qty, 'samples', th.number, 'عينات / تسترز مجانية'+(th.customerName?' - '+th.customerName:''));
    });
    persist('products');
    const value = th.items.reduce((s,it)=>s+it.qty*(it.cost||0),0);
    if(value>0){
      postJournal(th.date, 'عينات وتسترز مجانية '+th.number+(th.customerName?' - '+th.customerName:''), [
        {accountId:'acc_samples', debit:value, credit:0},
        {accountId:'acc_inventory', debit:0, credit:value},
      ], 'tester_handout', th.id);
    }
    logActivity('samples', 'اعتماد توزيع عينات/تسترز '+th.number+' بقيمة '+money(value));

function deleteTesterHandout(id){
  if(!requirePerm('delete_invoices','حذف توزيع العينات/التسترز')) return;
  const th = DB.testerHandouts.find(x=>x.id===id);
  if(!th) return;
  const isApproved = (th.status||'approved')==='approved';
  if(isApproved && !checkPeriodLock(th.date)) return;
  const msg = isApproved
    ? 'التوزيع ده معتمد ومترحّل بالفعل — سيتم إرجاع الكمية للمخزون وحذف قيد المصروف بالكامل. هل أنت متأكد؟'
    : 'هل تريد حذف هذا التوزيع نهائياً؟';
  confirmAction('حذف التوزيع', msg, ()=>{
    if(isApproved){
      th.items.forEach(it=>{
        const p = productById(it.productId);
        if(p) p.quantity += it.qty;
        logStockMove(it.productId, it.qty, 'samples_delete', th.number, 'حذف توزيع عينات/تسترز');
      });
      persist('products');
      removeJournalBySource(th.id);
    }
    DB.testerHandouts = DB.testerHandouts.filter(x=>x.id!==id);
    persist('testerHandouts');
    logActivity('samples', 'حذف توزيع عينات/تسترز '+th.number);
    closeModal(); render(); toast('تم الحذف بنجاح');
  });
}

function openConsignReportModal(){
  if(DB.customers.length===0){ toast('أضف عميل (متجر) أولاً'); return; }
  const customersOpts = DB.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  const dTax = DB.settings.taxRate!=null?DB.settings.taxRate:0;
  const body = `
    <div class="row2">
      <div class="field"><label>المتجر / نقطة البيع *</label><select id="f_party" onchange="onConsignReportPartyChange()">${'<option value="">اختر...</option>'+customersOpts}</select></div>
      <div class="field"><label>الفرع (اختياري)</label><select id="f_branch" onchange="onConsignReportPartyChange()"><option value="">بدون فرع - العنوان الرئيسي</option></select></div>
    </div>
    <div class="row2">
      <div class="field"><label>التاريخ</label><input id="f_date" type="date" value="${todayISO()}"></div>
      <div class="field"><label>رقم أمر شراء العميل (PO Number) - اختياري</label><input id="f_po" dir="ltr" style="text-align:left;" placeholder="مثال: PO-2026-0451"></div>
    </div>
    <p style="font-size:12px;color:var(--text-muted);margin:0 0 8px 0;">أدخل الكمية المباعة فعلياً لكل صنف بناءً على تقرير المتجر الدوري. الكمية القصوى = رصيد الأمانة الحالي.</p>
    <div id="consignReportItems"><p style="font-size:12.5px;color:var(--text-muted);">اختر المتجر أولاً لعرض أصناف الأمانة لديه.</p></div>
    <div class="row3" style="margin-top:14px;">
      <div class="field"><label>نسبة عمولة المتجر %</label><input id="f_commission" type="number" step="0.01" value="0" oninput="updateConsignReportTotals()"></div>
      <div class="field"><label>نسبة الضريبة %</label><input id="f_tax_rate" type="number" step="0.01" value="${dTax}" oninput="updateConsignReportTotals()"></div>
      <div class="field" style="display:flex;align-items:flex-end;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:9px;">
          <input type="checkbox" id="f_tax_enabled" ${DB.settings.taxEnabled?'checked':''} onchange="updateConsignReportTotals()" style="width:auto;">
          تطبيق الضريبة
        </label>
      </div>
    </div>
    <div style="margin-top:8px;">
      <div class="tot-line"><span>إجمالي المبيعات</span><span class="tnum" id="crSubtotal">${money(0)}</span></div>
      <div class="tot-line"><span>الضريبة</span><span class="tnum" id="crTax">${money(0)}</span></div>
      <div class="tot-line"><span>عمولة المتجر</span><span class="tnum" id="crCommission">${money(0)}</span></div>
      <div class="tot-line grand"><span>صافي المستحق لنا</span><span class="tnum" id="crTotal">${money(0)}</span></div>
      <div class="field" style="margin-top:8px;"><label>الخزينة / الحساب البنكي عند التحصيل الآن</label><select id="f_cashacc">${cashBankOptionsHtml()}</select></div>
      <div class="field"><label>المبلغ المُحصَّل الآن (اختياري)</label><input id="f_paid" type="number" step="0.01" value="0"></div>
    </div>
  `;
  openModal('تسجيل تقرير مبيعات أمانة', body, ()=>{
    const partyId = document.getElementById('f_party').value;
    if(!partyId){ toast('اختر المتجر'); return false; }
    const date = document.getElementById('f_date').value || todayISO();
    const poNumber = document.getElementById('f_po') ? document.getElementById('f_po').value.trim() : '';
    const cust = customerById(partyId);
    const branchId = document.getElementById('f_branch') ? document.getElementById('f_branch').value : '';
    const branch = branchId ? (cust.branches||[]).find(b=>b.id===branchId) : null;
    const qtyInputs = Array.from(document.querySelectorAll('.consign-qty-sold'));
    const items = [];
    for(const inp of qtyInputs){
      const qtySold = parseFloat(inp.value)||0;
      if(qtySold<=0) continue;
      const productId = inp.dataset.productId;
      const p = productById(productId);
      const held = consignStockFor(partyId, productId, branchId||null);
      if(qtySold>held+0.001){ toast('كمية البيع من "'+p.name+'" أكبر من رصيد الأمانة لديه'); return false; }
      items.push({productId, name:p.name, code:p.code||'', qtySold, price:p.salePrice, cost:p.purchasePrice, total:qtySold*p.salePrice});
    }
    if(items.length===0){ toast('أدخل كمية مباعة لصنف واحد على الأقل'); return false; }
    if(!checkPeriodLock(date)) return false;
    const subtotal = items.reduce((s,it)=>s+it.total,0);
    const taxEnabled = document.getElementById('f_tax_enabled').checked;
    const taxRate = parseFloat(document.getElementById('f_tax_rate').value)||0;
    const taxAmount = taxEnabled ? subtotal*taxRate/100 : 0;
    const commissionPercent = parseFloat(document.getElementById('f_commission').value)||0;
    const commissionAmount = subtotal*commissionPercent/100;
    const total = subtotal + taxAmount - commissionAmount;
    const paid = Math.min(parseFloat(document.getElementById('f_paid').value)||0, total);
    const cashAcc = document.getElementById('f_cashacc').value;
    const cost = items.reduce((s,it)=>s+it.qtySold*(it.cost||0),0);
    const rep = { id:uid(), number:nextNumber(DB.consignReports,'CSR'), date, customerId:partyId, customerName:cust.name, branchId:branchId||null, branchName:branch?branch.name:null, branchAddress:branch?branch.address:null, poNumber, items, subtotal, taxEnabled, taxRate, taxAmount, commissionPercent, commissionAmount, total, paidAmount:paid, createdAt:Date.now(), createdBy:currentUserName() };
    DB.consignReports.push(rep);
    items.forEach(it=>{ logStockMove(it.productId, -it.qtySold, 'consign_sold', rep.number, 'مبيعات أمانة - '+cust.name); });
    persist('consignReports');
    const lines = [
      {accountId:'acc_ar', debit:total, credit:0, partyType:'customer', partyId, partyName:cust.name},
      {accountId:'acc_sales', debit:0, credit:subtotal},
    ];
    if(taxAmount>0) lines.push({accountId:'acc_vat_out', debit:0, credit:taxAmount});
    if(commissionAmount>0) lines.push({accountId:'acc_consign_comm', debit:commissionAmount, credit:0});
    if(cost>0){ lines.push({accountId:'acc_cogs', debit:cost, credit:0}); lines.push({accountId:'acc_consign_inv', debit:0, credit:cost}); }
    postJournal(date, 'تقرير مبيعات أمانة '+rep.number+' - '+cust.name, lines, 'consign_report', rep.id);
    if(paid>0){
      postJournal(date, 'تحصيل عند تقرير أمانة '+rep.number, [
        {accountId:cashAcc, debit:paid, credit:0},
        {accountId:'acc_ar', debit:0, credit:paid, partyType:'customer', partyId, partyName:cust.name},
      ], 'consign_report', rep.id);
    }
    logActivity('consignment', 'تقرير مبيعات أمانة '+rep.number+' - '+cust.name+' بقيمة '+money(total));
    const invItems = items.map(it=>({productId:it.productId, name:it.name, code:it.code, qty:it.qtySold, price:it.price, cost:it.cost, total:it.total, unit:'قطعة'}));
    const mirrorInv = {
      id:uid(), number:nextInvoiceNo(), date, partyId, partyName:cust.name, poNumber,
      branchId:branchId||null, branchName:branch?branch.name:null, branchAddress:branch?branch.address:null,
      items:invItems, subtotal, discountType:'amount', discountValue:0, discountAmount:0,
      taxEnabled, taxRate, taxAmount, total, paidAmount:paid,
      paymentTerm:'consignment', termLabel:'بيع بالأمانة', dueDate:date,
      fromConsignment:true, consignReportId:rep.id, commissionAmount, commissionPercent,
      createdAt:Date.now(), createdBy:currentUserName()
    };
    DB.sales.push(mirrorInv);
    persist('sales');
    closeModal(); goTo('sales');
    printInvoice('sales', mirrorInv.id);
    toast('تم تسجيل التقرير وإصدار فاتورة بيع رقم '+mirrorInv.number+' - وفتحنا نافذة الطباعة لك');
  });
}
function onConsignReportPartyChange(){
  const partyId = document.getElementById('f_party').value;
  const wrap = document.getElementById('consignReportItems');
  const branchSel = document.getElementById('f_branch');
  const currentBranchVal = branchSel ? branchSel.value : '';
  if(branchSel){
    const cust = partyId ? customerById(partyId) : null;
    const branches = (cust && cust.branches) || [];
    const isSameParty = branchSel.dataset.forParty===partyId;
    branchSel.innerHTML = '<option value="">بدون فرع - العنوان الرئيسي</option>' + branches.map(b=>`<option value="${b.id}" ${isSameParty&&b.id===currentBranchVal?'selected':''}>${esc(b.name)}</option>`).join('');
    branchSel.dataset.forParty = partyId;
  }
  if(!partyId){ wrap.innerHTML = `<p style="font-size:12.5px;color:var(--text-muted);">اختر المتجر أولاً لعرض أصناف الأمانة لديه.</p>`; return; }
  const branchId = branchSel ? (branchSel.value||null) : null;
  const map = consignStockMap(partyId, branchId);
  const rows = Object.keys(map).map(pid=>{ const p = productById(pid); return {p, held:map[pid]}; }).filter(r=>r.p && r.held>0.001);
  if(rows.length===0){ wrap.innerHTML = `<p style="font-size:12.5px;color:var(--text-muted);">لا توجد بضاعة أمانة لدى هذا ${branchId?'الفرع':'المتجر'} حالياً.</p>`; return; }
  wrap.innerHTML = `
    <div class="item-rows">
      <div class="item-row head-row" style="grid-template-columns:2fr 1fr 1fr;"><div>المنتج</div><div>الرصيد لديه</div><div>الكمية المباعة</div></div>

        <div class="item-row" style="grid-template-columns:2fr 1fr 1fr;">
          <div>${esc(r.p.name)}</div>
          <div class="tnum">${fmt(r.held)}</div>
          <div><input type="number" class="consign-qty-sold" data-product-id="${r.p.id}" min="0" max="${r.held}" step="1" value="0" oninput="updateConsignReportTotals()"></div>
        </div>`).join('')}
    </div>
  `;
  updateConsignReportTotals();
}
function updateConsignReportTotals(){
  let subtotal = 0;
  document.querySelectorAll('.consign-qty-sold').forEach(inp=>{
    const qty = parseFloat(inp.value)||0;
    const p = productById(inp.dataset.productId);
    if(p) subtotal += qty*p.salePrice;
  });
  const taxEnabled = document.getElementById('f_tax_enabled') ? document.getElementById('f_tax_enabled').checked : false;
  const taxRate = parseFloat((document.getElementById('f_tax_rate')||{}).value)||0;
  const taxAmount = taxEnabled ? subtotal*taxRate/100 : 0;
  const commissionPercent = parseFloat((document.getElementById('f_commission')||{}).value)||0;
  const commissionAmount = subtotal*commissionPercent/100;
  const total = subtotal + taxAmount - commissionAmount;
  const set = (id,val)=>{ const el = document.getElementById(id); if(el) el.textContent = val; };
  set('crSubtotal', money(subtotal));
  set('crTax', money(taxAmount));
  set('crCommission', money(commissionAmount));
  set('crTotal', money(total));
}

function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  const rows = [];
  let i=0, field='', row=[], inQuotes=false;
  while(i<text.length){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){
        if(text[i+1]==='"'){ field+='"'; i+=2; continue; }
        inQuotes=false; i++; continue;
      }else{ field+=c; i++; continue; }
    }else{
      if(c==='"'){ inQuotes=true; i++; continue; }
      if(c===','){ row.push(field); field=''; i++; continue; }
      if(c==='\r'){ i++; continue; }
      if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
      field+=c; i++; continue;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>!(r.length===1 && r[0].trim()===''));
}

function exportCSV(filename, headers, rows){
  const escCsv = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines = [headers.map(escCsv).join(','), ...rows.map(r=>r.map(escCsv).join(','))];
  const csv = '\uFEFF'+lines.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  logActivity('export', 'تصدير ملف: '+filename);
}

function reportVat(){
  const salesInRange = DB.sales.filter(s=>inRange(s.date));
  const purchInRange = DB.purchases.filter(s=>inRange(s.date));
  const salesReturnsInRange = DB.returns.filter(r=>r.type==='sale_return' && inRange(r.date));
  const purchReturnsInRange = DB.returns.filter(r=>r.type==='purchase_return' && inRange(r.date));
  const outputTax = salesInRange.reduce((s,i)=>s+(i.taxAmount||0),0) - salesReturnsInRange.reduce((s,r)=>s+(r.taxAmount||0),0);
  const inputTax = purchInRange.reduce((s,i)=>s+(i.taxAmount||0),0) - purchReturnsInRange.reduce((s,r)=>s+(r.taxAmount||0),0);
  const net = outputTax - inputTax;
  const taxableSales = salesInRange.reduce((s,i)=>s+(i.subtotal-i.discountAmount||0),0);
  const taxablePurch = purchInRange.reduce((s,i)=>s+(i.subtotal-i.discountAmount||0),0);
  return `
    <div class="stat-grid">
      <div class="stat-card"><div class="lbl">صافي المبيعات الخاضعة للضريبة</div><div class="val">${money(taxableSales)}</div></div>
      <div class="stat-card gold"><div class="lbl">ضريبة المخرجات (على المبيعات)</div><div class="val">${money(outputTax)}</div></div>
      <div class="stat-card"><div class="lbl">صافي المشتريات الخاضعة للضريبة</div><div class="val">${money(taxablePurch)}</div></div>
      <div class="stat-card gold"><div class="lbl">ضريبة المدخلات (على المشتريات)</div><div class="val">${money(inputTax)}</div></div>
      <div class="stat-card ${net>=0?'red':'green'}"><div class="lbl">${net>=0?'صافي الضريبة المستحقة للسداد':'صافي الضريبة القابلة للاسترداد'}</div><div class="val">${money(Math.abs(net))}</div></div>
    </div>
    <p style="font-size:12px;color:var(--text-muted);margin-top:14px;">هذا التقرير إرشادي لمساعدتك في إعداد الإقرار الضريبي، ولا يغني عن مراجعة محاسب أو مأمورية الضرائب.</p>
  `;
}

  const list = DB.sales.filter(s=>inRange(s.date));
  if(list.length===0) return emptyState('لا توجد بيانات','لا توجد مبيعات ضمن الفترة المحددة لحساب الأرباح');
  let revenue=0, cost=0;
  list.forEach(s=> s.items.forEach(it=>{ revenue += it.qty*it.price; cost += it.qty*(it.cost||0); }));

function agingBuckets(list, kind){
  const today = todayISO();
  const rows = list.map(x=>{
    const invs = DB[kind].filter(s=>s.partyId===x.id);
    const buckets = {b0:0, b30:0, b60:0, b90:0};
    invs.forEach(inv=>{
      const due = inv.total - inv.paidAmount;
      if(due<=0.009) return;
      const dueDate = inv.dueDate || inv.date;
      const days = Math.floor((new Date(today) - new Date(dueDate)) / 86400000);
      if(days<=0) buckets.b0 += due;
      else if(days<=30) buckets.b0 += due;
      else if(days<=60) buckets.b30 += due;
      else if(days<=90) buckets.b60 += due;
      else buckets.b90 += due;
    });
    const total = buckets.b0+buckets.b30+buckets.b60+buckets.b90;
    return {name:x.name, ...buckets, total};
  }).filter(r=>r.total>0.009).sort((a,b)=>b.total-a.total);
  return rows;
}

function reportTop(){
  const map = {};
  DB.sales.filter(s=>inRange(s.date)).forEach(s=>s.items.forEach(it=>{
    if(!map[it.productId]) map[it.productId] = {name:it.name, qty:0, total:0};
    map[it.productId].qty += it.qty; map[it.productId].total += it.total;
  }));
  const rows = Object.values(map).sort((a,b)=>b.qty-a.qty).slice(0,10);
  if(rows.length===0) return emptyState('لا توجد بيانات','لا توجد مبيعات ضمن الفترة المحددة');
  const maxQty = Math.max(...rows.map(r=>r.qty));

let ledgerAccountId = '';
let ledgerPartyId = {customers:'', suppliers:''};
function reportLedger(){
  if(DB.accounts.length===0) return emptyState('لا توجد حسابات','أضف حسابات من دليل الحسابات');
  if(!ledgerAccountId) ledgerAccountId = DB.accounts[0].id;
  const acc = accountById(ledgerAccountId);
  const isDebitNormal = DEBIT_NORMAL[acc.type];
  const lines = [];
  DB.journal.filter(j=> (!repFrom || j.date>=repFrom) && (!repTo || j.date<=repTo)).sort((a,b)=> a.date<b.date?-1:1).forEach(j=>{
    j.lines.forEach(l=>{ if(l.accountId===ledgerAccountId) lines.push({date:j.date, memo:j.memo, debit:l.debit||0, credit:l.credit||0}); });
  });
  let running = 0;
  const rowsHtml = lines.map(l=>{
    running += isDebitNormal ? (l.debit-l.credit) : (l.credit-l.debit);
    return `<tr><td>${fmtDate(l.date)}</td><td>${esc(l.memo)}</td><td class="tnum">${l.debit?money(l.debit):'-'}</td><td class="tnum">${l.credit?money(l.credit):'-'}</td><td class="tnum" style="font-weight:700;">${money(running)}</td></tr>`;
  }).join('');
  return `
    <div class="field" style="max-width:340px;"><label>اختر الحساب</label>
      <select onchange="ledgerAccountId=this.value; render();">
        ${DB.accounts.map(a=>`<option value="${a.id}" ${a.id===ledgerAccountId?'selected':''}>${a.code} - ${esc(a.name)}</option>`).join('')}
      </select>
    </div>
    ${lines.length===0? emptyState('لا توجد حركات','لا توجد قيود على هذا الحساب ضمن الفترة المحددة') : `
    <div class="table-wrap"><table>
      <thead><tr><th>التاريخ</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>`}
  `;
}
function reportPartyLedger(kind){
  const isCust = kind==='customers';
  const partyList = DB[kind];
  if(partyList.length===0) return emptyState('لا توجد بيانات', isCust?'لا يوجد عملاء مسجلين':'لا يوجد موردين مسجلين');
  if(!ledgerPartyId[kind] && partyList.length>0) ledgerPartyId[kind] = partyList[0].id;
  const selectedId = ledgerPartyId[kind];
  const party = partyList.find(p=>p.id===selectedId);
  const lines = [];
  DB.journal.filter(j=> (!repFrom || j.date>=repFrom) && (!repTo || j.date<=repTo)).sort((a,b)=> a.date<b.date?-1:1).forEach(j=>{
    j.lines.forEach(l=>{
      if(l.partyId===selectedId && l.partyType===(isCust?'customer':'supplier')){
        lines.push({date:j.date, memo:j.memo, debit:l.debit||0, credit:l.credit||0});
      }
    });
  });
  let running = 0;
  const isDebitNormal = isCust; // AR is asset (debit-normal), AP is liability (credit-normal)
  const rowsHtml = lines.map(l=>{
    running += isDebitNormal ? (l.debit-l.credit) : (l.credit-l.debit);
    return `<tr><td>${fmtDate(l.date)}</td><td>${esc(l.memo)}</td><td class="tnum">${l.debit?money(l.debit):'-'}</td><td class="tnum">${l.credit?money(l.credit):'-'}</td><td class="tnum" style="font-weight:700;">${money(running)}</td></tr>`;
  }).join('');
  return `
    <div class="field" style="max-width:340px;"><label>${isCust?'اختر العميل':'اختر المورد'}</label>
      <select onchange="ledgerPartyId['${kind}']=this.value; render();">
        ${partyList.map(p=>`<option value="${p.id}" ${p.id===selectedId?'selected':''}>${esc(p.name)}</option>`).join('')}
      </select>
    </div>
    ${party?`<div class="stat-grid" style="margin:14px 0;">
      <div class="stat-card ${isDebitNormal?'green':'red'}"><div class="lbl">الرصيد ${isCust?'المستحق (له)':'المستحق (عليه)'}</div><div class="val">${money(Math.abs(running))}</div></div>
      <div class="stat-card"><div class="lbl">عدد الحركات ضمن الفترة</div><div class="val">${lines.length}</div></div>
    </div>`:''}
    ${lines.length===0? emptyState('لا توجد حركات','لا توجد قيود على هذا '+(isCust?'العميل':'المورد')+' ضمن الفترة المحددة') : `
    <div class="table-wrap"><table>
      <thead><tr><th>التاريخ</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>`}
  `;
}
function reportIncomeStatement(){
  const revAccs = DB.accounts.filter(a=>a.type==='revenue');
  const expAccs = DB.accounts.filter(a=>a.type==='expense');
  const revRows = revAccs.map(a=>({a, val:accountBalance(a.id, repFrom, repTo)}));
  const expRows = expAccs.map(a=>({a, val:accountBalance(a.id, repFrom, repTo)}));
  const totalRev = revRows.reduce((s,r)=>s+r.val,0);
  const totalExp = expRows.reduce((s,r)=>s+r.val,0);
  const cogs = accountBalance('acc_cogs', repFrom, repTo);
  const grossProfit = totalRev - cogs;
  const net = totalRev-totalExp;
  const grossMargin = totalRev>0 ? (grossProfit/totalRev*100) : 0;
  const netMargin = totalRev>0 ? (net/totalRev*100) : 0;
  return `
    <h3 style="font-size:14.5px;color:var(--primary-dark);">الإيرادات</h3>
    <div class="table-wrap"><table><tbody>
      ${revRows.map(r=>`<tr><td>${esc(r.a.name)}</td><td class="tnum">${money(r.val)}</td></tr>`).join('')}
      <tr><td style="font-weight:700;">إجمالي الإيرادات</td><td class="tnum" style="font-weight:700;">${money(totalRev)}</td></tr>
    </tbody></table></div>
    <h3 style="font-size:14.5px;color:var(--primary-dark);margin-top:18px;">المصروفات</h3>
    <div class="table-wrap"><table><tbody>
      ${expRows.map(r=>`<tr><td>${esc(r.a.name)}</td><td class="tnum">${money(r.val)}</td></tr>`).join('')}
      <tr><td style="font-weight:700;">إجمالي المصروفات</td><td class="tnum" style="font-weight:700;">${money(totalExp)}</td></tr>
    </tbody></table></div>
    <div class="stat-grid" style="margin-top:18px;">
      <div class="stat-card"><div class="lbl">إجمالي الربح (قبل خصم المصروفات العامة)</div><div class="val">${money(grossProfit)}</div></div>
      <div class="stat-card gold"><div class="lbl">هامش الربح الإجمالي (Gross Margin)</div><div class="val">${grossMargin.toFixed(1)}%</div></div>
      <div class="stat-card ${net>=0?'green':'red'}"><div class="lbl">صافي الربح / الخسارة</div><div class="val">${money(net)}</div></div>
      <div class="stat-card ${netMargin>=0?'green':'red'}"><div class="lbl">هامش صافي الربح (Net Margin)</div><div class="val">${netMargin.toFixed(1)}%</div></div>
    </div>
    <p style="font-size:11.5px;color:var(--text-muted);margin-top:10px;">هامش الربح الإجمالي = (الإيرادات - تكلفة البضاعة المباعة) ÷ الإيرادات. هامش صافي الربح = صافي الربح ÷ الإيرادات (بعد خصم كل المصروفات).</p>
  `;
}
function reportBalanceSheet(){
  const asOf = repTo || todayISO();
  const assetAccs = DB.accounts.filter(a=>a.type==='asset');
  const liabAccs = DB.accounts.filter(a=>a.type==='liability');
  const equityAccs = DB.accounts.filter(a=>a.type==='equity');
  const revAccs = DB.accounts.filter(a=>a.type==='revenue');
  const expAccs = DB.accounts.filter(a=>a.type==='expense');
  const assetRows = assetAccs.map(a=>({a, val:accountBalance(a.id, null, asOf)}));
  const liabRows = liabAccs.map(a=>({a, val:accountBalance(a.id, null, asOf)}));
  const equityRows = equityAccs.map(a=>({a, val:accountBalance(a.id, null, asOf)}));
  const netIncome = revAccs.reduce((s,a)=>s+accountBalance(a.id,null,asOf),0) - expAccs.reduce((s,a)=>s+accountBalance(a.id,null,asOf),0);
  const totalAssets = assetRows.reduce((s,r)=>s+r.val,0);
  const totalLiab = liabRows.reduce((s,r)=>s+r.val,0);
  const totalEquity = equityRows.reduce((s,r)=>s+r.val,0) + netIncome;
  return `
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">كما في تاريخ: ${fmtDate(asOf)}</div>
    <div class="row2">
      <div>
        <h3 style="font-size:14.5px;color:var(--primary-dark);">الأصول</h3>
        <div class="table-wrap"><table><tbody>
          ${assetRows.map(r=>`<tr><td>${esc(r.a.name)}</td><td class="tnum">${money(r.val)}</td></tr>`).join('')}
          <tr><td style="font-weight:700;">إجمالي الأصول</td><td class="tnum" style="font-weight:700;">${money(totalAssets)}</td></tr>
        </tbody></table></div>
      </div>
      <div>
        <h3 style="font-size:14.5px;color:var(--primary-dark);">الخصوم وحقوق الملكية</h3>
        <div class="table-wrap"><table><tbody>
          ${liabRows.map(r=>`<tr><td>${esc(r.a.name)}</td><td class="tnum">${money(r.val)}</td></tr>`).join('')}
          <tr><td style="font-weight:700;">إجمالي الخصوم</td><td class="tnum" style="font-weight:700;">${money(totalLiab)}</td></tr>
          ${equityRows.map(r=>`<tr><td>${esc(r.a.name)}</td><td class="tnum">${money(r.val)}</td></tr>`).join('')}
          <tr><td>صافي الربح (غير مرحل)</td><td class="tnum">${money(netIncome)}</td></tr>
          <tr><td style="font-weight:700;">إجمالي حقوق الملكية</td><td class="tnum" style="font-weight:700;">${money(totalEquity)}</td></tr>
        </tbody></table></div>
      </div>
    </div>
    <div class="stat-grid" style="margin-top:16px;">
      <div class="stat-card"><div class="lbl">إجمالي الأصول</div><div class="val">${money(totalAssets)}</div></div>
      <div class="stat-card"><div class="lbl">إجمالي الخصوم + حقوق الملكية</div><div class="val">${money(totalLiab+totalEquity)}</div></div>
      <div class="stat-card ${Math.abs(totalAssets-(totalLiab+totalEquity))<0.01?'green':'red'}"><div class="lbl">حالة التوازن</div><div class="val" style="font-size:15px;">${Math.abs(totalAssets-(totalLiab+totalEquity))<0.01?'متوازنة ✓':'غير متوازنة!'}</div></div>
    </div>
  `;
}

function openTransferModal(){
  const accs = cashBankAccounts();

  const opts = accs.map(a=>`<option value="${a.id}">${esc(a.name)} (${money(accountBalance(a.id))})</option>`).join('');
  const body = `
    <div class="row2">
      <div class="field"><label>من</label><select id="f_from">${opts}</select></div>
      <div class="field"><label>إلى</label><select id="f_to">${opts}</select></div>
    </div>
    <div class="row2">
      <div class="field"><label>المبلغ</label><input id="f_amt" type="number" step="0.01" value="0"></div>
      <div class="field"><label>التاريخ</label><input id="f_date" type="date" value="${todayISO()}"></div>
    </div>
    <div class="field"><label>ملاحظات</label><input id="f_memo" placeholder="تحويل بين الخزائن"></div>
  `;
  openModal('تحويل بين الخزائن', body, ()=>{
    const from = document.getElementById('f_from').value;
    const to = document.getElementById('f_to').value;
    const amt = parseFloat(document.getElementById('f_amt').value)||0;
    const date = document.getElementById('f_date').value || todayISO();
    const memo = document.getElementById('f_memo').value.trim() || 'تحويل بين الخزائن';
    if(from===to){ toast('اختر حسابين مختلفين'); return false; }
    if(amt<=0){ toast('أدخل مبلغ صحيح'); return false; }
    const fromAcc = accountById(from), toAcc = accountById(to);
    postJournal(date, memo+' ('+fromAcc.name+' → '+toAcc.name+')', [
      {accountId:to, debit:amt, credit:0},
      {accountId:from, debit:0, credit:amt},
    ], 'manual');
    logActivity('transfer', 'تحويل '+money(amt)+' من '+fromAcc.name+' إلى '+toAcc.name);
    closeModal(); render(); toast('تم التحويل بنجاح');
  });
}

function deleteManualJournal(id){

        {key:'accountName', label:'حساب المصروف'},

function addExpenseRow(){

function onExpenseAttachSelected(ev){
  const file = ev.target.files[0];
  if(!file) return;
  if(file.size > 1.5*1024*1024){ toast('حجم الملف كبير جداً - اختر ملف أصغر من 1.5MB'); return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    window._newExpenseAttachment = reader.result;
    window._newExpenseAttachmentName = file.name;
    const preview = document.getElementById('expAttachPreview');
    if(preview) preview.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface-2);border-radius:8px;">
        ${icon('printer')}<span style="font-size:12.5px;flex:1;">${esc(file.name)}</span>
        <a href="${reader.result}" target="_blank" style="font-size:12px;color:var(--primary);">عرض</a>
      </div>`;
  };
  reader.readAsDataURL(file);
}

function rejectExpenseBatch(batchId){

  if(items.length===0) return;
  confirmAction('رفض دفعة مصروفات', 'هل تريد رفض '+items.length+' مصروف؟', ()=>{
    items.forEach(exp=>{ exp.status='rejected'; exp.rejectedBy=currentUserName(); exp.rejectedAt=Date.now(); });
    persist('expenses');
    logActivity('expense_reject', 'رفض دفعة من '+items.length+' مصروف');
    closeModal(); render(); toast('تم الرفض');
  });
}
function deleteExpenseBatch(batchId){
  if(!requirePerm('delete_invoices','حذف المصروفات')) return;
  const items = DB.expenses.filter(e=>e.batchId===batchId);
  if(items.length===0) return;
  const anyApproved = items.some(e=>(e.status||'approved')==='approved');
  if(anyApproved && !checkPeriodLock(items[0].date)) return;
  confirmAction('حذف دفعة مصروفات', 'سيتم حذف '+items.length+' مصروف'+(anyApproved?' وعكس القيود المحاسبية المعتمدة منهم':'')+'. هل أنت متأكد؟', ()=>{
    items.forEach(exp=>{
      if((exp.status||'approved')==='approved') removeJournalBySource(exp.id);
    });
    DB.expenses = DB.expenses.filter(e=>e.batchId!==batchId);
    persist('expenses');
    logActivity('expense_delete', 'حذف دفعة من '+items.length+' مصروف');
    closeModal(); render(); toast('تم الحذف');
  });
}
function deleteExpense(id){
  if(!requirePerm('delete_invoices','حذف المصروفات')) return;
  const exp = DB.expenses.find(x=>x.id===id);
  if(!exp) return;
  if(exp.fromCustody && exp.custodyEntryId){ deleteCustodyEntry(exp.custodyEntryId); return; }
  const isApproved = (exp.status||'approved')==='approved';
  if(isApproved && !checkPeriodLock(exp.date)) return;
  const msg = isApproved ? 'المصروف ده معتمد ومترحّل بالفعل - سيتم حذف القيد المحاسبي بالكامل. هل أنت متأكد؟' : 'هل تريد حذف هذا المصروف نهائياً؟';
  confirmAction('حذف المصروف', msg, ()=>{
    if(isApproved) removeJournalBySource(exp.id);
    DB.expenses = DB.expenses.filter(x=>x.id!==id);
    persist('expenses');
    logActivity('expense_delete', 'حذف مصروف: '+exp.memo+' بمبلغ '+money(exp.amount));
    closeModal(); render(); toast('تم الحذف بنجاح');
  });
}

function renderExpensesTab(){
  let entries = [...DB.expenses];
  if(!can('view_all_expenses')) entries = entries.filter(e=>e.createdBy===currentUserName());
  const employeeList = [...new Set(DB.expenses.map(e=>e.createdBy).filter(Boolean))].sort();
  if(can('view_all_expenses') && expUserFilter) entries = entries.filter(e=>e.createdBy===expUserFilter);
  if(expFrom) entries = entries.filter(e=>e.date>=expFrom);

    const aPending = a.status==='pending' ? 0 : 1;

  const thisMonthTotal = entries.filter(e=>(e.status||'approved')==='approved' && e.date.slice(0,7)===thisMonthKey).reduce((s,e)=>s+e.amount,0);
  const visibleIds = entries.map(e=>e.id);
  const allSelected = visibleIds.length>0 && visibleIds.every(id=>selectedExpenses.has(id));

    <div class="stat-grid">
      <div class="stat-card red"><div class="lbl">${icon('expense')} إجمالي المصروفات المعتمدة (حسب الفلتر)</div><div class="val">${money(totalAll)}</div></div>
      <div class="stat-card"><div class="lbl">مصروفات هذا الشهر (معتمدة)</div><div class="val">${money(thisMonthTotal)}</div></div>
      ${pendingCount>0?`<div class="stat-card gold"><div class="lbl">${icon('alert')} بانتظار الموافقة</div><div class="val">${pendingCount}</div></div>`:`<div class="stat-card"><div class="lbl">عدد الحركات</div><div class="val">${entries.length}</div></div>`}
    </div>
    <div class="card">
      <div class="card-head">
        <h2>سجل المصروفات</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" onclick="exportExpenses()">${icon('printer')} تصدير CSV</button>
          <button class="btn btn-outline btn-sm" onclick="document.getElementById('expImportFile').click()">${icon('duplicate')} استيراد CSV</button>
          <input type="file" id="expImportFile" accept=".csv" style="display:none;" onchange="importExpensesFile(event)">
          <button class="btn btn-primary" onclick="openExpenseModal()">${icon('plus')} مصروف جديد</button>
        </div>
      </div>
      <div class="search-bar">
        <input placeholder="بحث بالبيان..." value="${esc(expFilter)}" oninput="expFilter=this.value; render();">
        ${can('view_all_expenses')?`<select onchange="expUserFilter=this.value; render();" style="max-width:200px;">
          <option value="">كل الموظفين</option>
          ${employeeList.map(u=>`<option value="${esc(u)}" ${expUserFilter===u?'selected':''}>${esc(u)}</option>`).join('')}

          });
          return groups.map(group=>{

                <td class="tnum">${money(e.amount)}</td><td>${esc(e.createdBy||'-')}</td>
                <td>${e.attachment?`<a href="${e.attachment}" target="_blank" title="${esc(e.attachmentName||'عرض المرفق')}" style="color:var(--primary);display:inline-flex;">${icon('printer')}</a>`:'-'}</td>
                <td>
                  ${commentsButtonHtml('expense', e.id)}
                  ${e.fromCustody?`<button class="btn btn-outline btn-sm" onclick="openCustodyDetail('${e.custodyId}')">${icon('statement')} عرض العهدة</button>`:`
                  ${status==='pending'?`
                    <button class="btn btn-outline btn-icon btn-sm" onclick="editExpense('${e.id}')" title="تعديل">${icon('edit')}</button>
                    ${can('approve_expenses')?`<button class="btn btn-primary btn-sm" onclick="approveExpense('${e.id}')">${icon('plus')} اعتماد</button><button class="btn btn-danger-o btn-sm" onclick="rejectExpense('${e.id}')">رفض</button>`:''}
                  `:''}
                  ${can('delete_invoices')?`<button class="btn btn-danger-o btn-icon btn-sm" onclick="deleteExpense('${e.id}')">${icon('trash')}</button>`:''}
                  `}
                </td>
              </tr>`;
            }
            const batchId = group[0].batchId;
            const statuses = [...new Set(group.map(e=>e.status||'approved'))];
            const uniformStatus = statuses.length===1 ? statuses[0] : null;
            const statusBadge = uniformStatus==='pending' ? '<span class="badge partial">بانتظار الموافقة</span>' : uniformStatus==='rejected' ? '<span class="badge unpaid">مرفوض</span>' : uniformStatus==='approved' ? '<span class="badge paid">معتمد</span>' : '<span class="badge partial">حالات مختلفة</span>';
            const total = group.reduce((s,e)=>s+e.amount,0);
            const attach = group.find(e=>e.attachment);
            return `<tr>
              <td><span title="حدد كل بنود الدفعة من التفاصيل" style="color:var(--text-muted);">-</span></td>
              <td>${group[0].number} <span class="badge" style="background:var(--surface-2);">${group.length} بنود</span></td>
              <td>${statusBadge}</td><td>${fmtDate(group[0].date)}</td>
              <td colspan="2">إذن بـ${group.length} بنود مصروفات <a href="#" onclick="viewExpenseBatch('${batchId}');return false;" style="color:var(--primary);font-size:12px;">(عرض التفاصيل)</a></td>
              <td class="tnum" style="font-weight:700;">${money(total)}</td><td>${esc(group[0].createdBy||'-')}</td>
              <td>${attach?`<a href="${attach.attachment}" target="_blank" style="color:var(--primary);display:inline-flex;">${icon('printer')}</a>`:'-'}</td>
              <td>
                ${uniformStatus==='pending'?`${can('approve_expenses')?`<button class="btn btn-primary btn-sm" onclick="approveExpenseBatch('${batchId}')">${icon('plus')} اعتماد الكل</button><button class="btn btn-danger-o btn-sm" onclick="rejectExpenseBatch('${batchId}')">رفض الكل</button>`:''}`:''}
                ${can('delete_invoices')?`<button class="btn btn-danger-o btn-icon btn-sm" onclick="deleteExpenseBatch('${batchId}')" title="حذف الكل">${icon('trash')}</button>`:''}
              </td>
            </tr>`;
          }).join('');
        })()}</tbody>
      </table></div>`}
    </div>
  `;
}
/* ============ CUSTODY (العهد) ============ */
const CUSTODY_ENTRY_LABELS = {issue:'صرف عهدة', topup:'تعزيز عهدة', expense:'مصروف من العهدة', return:'إرجاع من العهدة'};
function custodyBalance(custodyId){
  const entries = DB.custodyEntries.filter(e=>e.custodyId===custodyId && (e.status||'approved')==='approved');
  let bal = 0;
  entries.forEach(e=>{
    if(e.type==='issue' || e.type==='topup') bal += e.amount;
    else if(e.type==='expense' || e.type==='return') bal -= e.amount;
  });
  return bal;
}
