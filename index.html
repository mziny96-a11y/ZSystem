<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z International Beauty | نظام الحسابات</title>
<link id="favIcon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='30%25' cy='30%25'%3E%3Cstop offset='0%25' stop-color='%23E9C77E'/%3E%3Cstop offset='70%25' stop-color='%23D4A657'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='32' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-weight='700' font-size='32' fill='%233A2410' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E">
<link id="appleTouchIcon" rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='30%25' cy='30%25'%3E%3Cstop offset='0%25' stop-color='%23E9C77E'/%3E%3Cstop offset='70%25' stop-color='%23D4A657'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='32' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-weight='700' font-size='32' fill='%233A2410' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=El+Messiri:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F4F5F8;
  --bg-soft:#EAEBF0;
  --surface:#FFFFFF;
  --surface-2:#F6F7FA;
  --sidebar:#15161F;
  --sidebar-hover:#212230;
  --sidebar-text:#B8B9C7;
  --gold:#D4A657;
  --gold-light:#E9C77E;
  --primary:#C0245C;
  --primary-dark:#98183F;
  --primary-light:#FBE3ED;
  --text:#1A1B23;
  --text-muted:#767986;
  --border:#E4E5EB;
  --success:#12946B;
  --success-bg:#DDF5EC;
  --danger:#DC3545;
  --danger-bg:#FCE4E6;
  --warning:#D68A1F;
  --warning-bg:#FCEFD9;
  --radius:16px;
  --shadow: 0 2px 10px rgba(20,20,35,.05), 0 1px 2px rgba(20,20,35,.05);
}
html[data-theme="dark"]{
  color-scheme: dark;
  --bg:#14151C;
  --bg-soft:#1B1C25;
  --surface:#1E1F29;
  --surface-2:#262733;
  --sidebar:#0C0D13;
  --sidebar-hover:#1B1C25;
  --sidebar-text:#9C9EAF;
  --gold:#D4A657;
  --gold-light:#E9C77E;
  --primary:#E1477E;
  --primary-dark:#F080AA;
  --primary-light:#3A1F2C;
  --text:#EDEEF3;
  --text-muted:#8C8FA3;
  --border:#333544;
  --success:#22B88A;
  --success-bg:#123528;
  --danger:#F0576A;
  --danger-bg:#3A1A20;
  --warning:#E5A53D;
  --warning-bg:#3A2D14;
  --shadow: 0 2px 10px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
}
html[data-theme="dark"] body{background:var(--bg);}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100vw;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Tajawal',sans-serif;
  min-height:100vh;
}
h1,h2,h3,.brand,.display{font-family:'El Messiri',serif;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

#appLoader{
  position:fixed;inset:0;z-index:9999;
  background:radial-gradient(circle at 30% 20%, #2A1D16, var(--sidebar) 60%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .4s ease, visibility .4s ease;
}
#appLoader.loader-hidden{opacity:0;visibility:hidden;pointer-events:none;}
.loader-mark{position:relative;width:76px;height:110px;display:flex;align-items:center;justify-content:center;}
.loader-bottle{height:100px;width:auto;object-fit:contain;filter:drop-shadow(0 6px 16px rgba(212,166,87,.4));animation:loaderBottlePulse 2.6s ease-in-out infinite;}
@keyframes loaderBottlePulse{ 0%,100%{ opacity:.92; transform:translateY(0); } 50%{ opacity:1; transform:translateY(-3px); } }
.loader-mist{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:40px;height:36px;z-index:2;}
.loader-mist span{
  position:absolute;bottom:0;border-radius:50%;background:radial-gradient(circle, rgba(240,223,175,.85), rgba(212,166,87,0));
  animation:loaderMistRise 2.2s ease-out infinite;opacity:0;
}
.loader-mist span:nth-child(1){left:6px;width:5px;height:5px;animation-delay:0s;}
.loader-mist span:nth-child(2){left:16px;width:4px;height:4px;animation-delay:.4s;}
.loader-mist span:nth-child(3){left:24px;width:6px;height:6px;animation-delay:.8s;}
.loader-mist span:nth-child(4){left:14px;width:3px;height:3px;animation-delay:1.2s;}
@keyframes loaderMistRise{
  0%{ opacity:0; transform:translateY(0) scale(.4); }
  25%{ opacity:.9; }
  100%{ opacity:0; transform:translateY(-34px) scale(1.3); }
}
.loader-name{font-family:'El Messiri',serif;font-size:15px;color:#F3E9DC;letter-spacing:.02em;}
.loader-dots{display:flex;gap:6px;}
.loader-dots span{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:loaderDot 1.2s ease-in-out infinite;}
.loader-dots span:nth-child(2){animation-delay:.15s;}
.loader-dots span:nth-child(3){animation-delay:.3s;}
@keyframes loaderDot{ 0%,80%,100%{ opacity:.25; transform:translateY(0); } 40%{ opacity:1; transform:translateY(-4px); } }
#app{display:flex;flex-direction:column;min-height:100vh;max-width:100vw;overflow-x:hidden;}
.app-topnav{display:flex;flex-direction:column;min-height:100vh;max-width:100vw;overflow-x:hidden;}

/* TOP NAV */
.topnav{
  display:flex;align-items:center;gap:22px;
  background:var(--sidebar);color:var(--sidebar-text);
  padding:0 24px;height:64px;flex:none;
  position:sticky;top:0;z-index:30;
}
.topnav-brand{display:flex;align-items:center;gap:10px;flex:none;}
.brand-mark{
  width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, var(--gold-light), var(--gold) 70%);
  display:flex;align-items:center;justify-content:center;
  font-family:'El Messiri',serif;font-weight:700;font-size:17px;color:#3A2410;flex:none;
}
.brand-titles{overflow:hidden;}
.brand-name{font-size:14.5px;font-weight:700;color:#F3E9DC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;}
.brand-sub{font-size:10.5px;color:var(--sidebar-text);opacity:.7;margin-top:1px;}

.topnav-menu{display:flex;align-items:center;gap:2px;flex:1;overflow-x:auto;overflow-y:visible;scrollbar-width:none;}
.topnav-menu::-webkit-scrollbar{display:none;}
.topnav-item{position:relative;flex:none;}
.topnav-btn{
  display:flex;align-items:center;gap:7px;padding:10px 13px;border-radius:9px;
  cursor:pointer;font-size:13px;font-weight:500;color:var(--sidebar-text);white-space:nowrap;user-select:none;
  transition:background .15s,color .15s;
}
.topnav-btn svg{flex:none;width:17px;height:17px;stroke:currentColor;}
.topnav-btn:hover{background:var(--sidebar-hover);color:#fff;}
.topnav-btn.active{background:linear-gradient(90deg, rgba(212,166,87,.22), rgba(212,166,87,.08));color:var(--gold-light);}
.topnav-btn .chev{width:12px;height:12px;stroke:currentColor;transition:transform .15s;flex:none;opacity:.7;}
.topnav-item.open .topnav-btn .chev{transform:rotate(180deg);}
.topnav-dropdown{
  position:fixed;top:64px;right:20px;min-width:220px;
  background:var(--surface);border:1px solid var(--border);border-radius:13px;
  box-shadow:0 16px 36px rgba(15,15,25,.2);padding:6px;z-index:60;
  display:none;
}
.topnav-item.open .topnav-dropdown{display:block;}
.dropdown-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;
  font-size:13.5px;color:var(--text);cursor:pointer;white-space:nowrap;
  transition:background .12s;
}
.dropdown-item svg{width:16px;height:16px;stroke:currentColor;flex:none;color:var(--text-muted);}
.dropdown-item:hover{background:var(--surface-2);}
.dropdown-item.active{background:var(--primary-light);color:var(--primary-dark);font-weight:700;}
.dropdown-item.active svg{color:var(--primary-dark);}
.dropdown-submenu{padding-inline-start:14px;border-inline-start:2px solid var(--border);margin-inline-start:11px;margin-top:2px;margin-bottom:4px;max-height:260px;overflow-y:auto;}
.dropdown-subitem{font-size:12.5px;padding:7px 11px;white-space:normal;}

.topnav-actions{display:flex;align-items:center;gap:10px;flex:none;}
.topnav-actions .btn-outline, .mobile-menu-btn.btn-outline{
  background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:var(--sidebar-text);
}
.topnav-actions .btn-outline:hover, .mobile-menu-btn.btn-outline:hover{
  background:rgba(255,255,255,.12);color:#F3E9DC;
}
.mobile-menu-btn{border-radius:10px;}
.topnav-userbar{display:flex;align-items:center;gap:8px;padding-right:10px;margin-right:2px;border-right:1px solid rgba(255,255,255,.12);}
[dir="ltr"] .topnav-userbar{border-right:none;padding-right:0;border-left:1px solid rgba(255,255,255,.12);padding-left:10px;margin-left:2px;}
.logout-btn{cursor:pointer;background:rgba(220,90,90,.14);border:1px solid rgba(220,90,90,.3);color:#E8918D;padding:7px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;transition:background .15s,color .15s;}
.logout-btn:hover{background:rgba(220,90,90,.28);color:#FFD3D0;}
.logout-btn svg{width:16px;height:16px;stroke:currentColor;}

/* PAGE */
.page-header{
  background:var(--bg);
  border-bottom:1px solid var(--border);
  padding:16px 28px;position:sticky;top:64px;z-index:20;
}
.page-header h1{margin:0;font-size:20px;font-weight:700;color:var(--text);}
.page-header .sub{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
.topdate{font-size:13px;color:var(--sidebar-text);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);padding:7px 14px;border-radius:10px;white-space:nowrap;}
.content{padding:22px 28px 60px 28px;flex:1;min-width:0;}


/* CARDS / GRID */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);transition:box-shadow .18s, transform .18s;}
.stat-card:hover{box-shadow:0 6px 18px rgba(60,40,30,.09), 0 2px 4px rgba(60,40,30,.07);transform:translateY(-1px);}
.stat-card .lbl{font-size:10.5px;color:var(--text-muted);margin-bottom:5px;display:flex;align-items:center;gap:5px;font-weight:500;}
.stat-card .lbl svg{width:13px;height:13px;}
.stat-card .val{font-size:17px;font-weight:700;font-family:'El Messiri',serif;color:var(--text);letter-spacing:-.01em;}
.stat-card.rose .val{color:var(--primary);}
.stat-card.gold .val{color:#8A6220;}
.stat-card.green .val{color:var(--success);}
.stat-card.red .val{color:var(--danger);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;margin-bottom:20px;}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--border);}
.card-head h2{font-size:16.5px;margin:0;font-weight:700;color:var(--text);letter-spacing:-.01em;}
.card-head .hint{font-size:12px;color:var(--text-muted);}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  font-family:'Tajawal',sans-serif;font-size:13.5px;font-weight:600;
  padding:9px 16px;border-radius:9px;border:1px solid transparent;
  cursor:pointer;transition:background .15s, box-shadow .15s, transform .1s, border-color .15s;
  white-space:nowrap;
}
.btn svg{width:15px;height:15px;stroke:currentColor;flex:none;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(140,75,92,.25);}
.btn-primary:hover{background:var(--primary-dark);box-shadow:0 3px 8px rgba(140,75,92,.32);}
.btn-gold{background:var(--gold);color:#3A2410;box-shadow:0 1px 2px rgba(212,166,87,.3);}
.btn-gold:hover{background:#B98940;box-shadow:0 3px 8px rgba(212,166,87,.35);}
.btn-outline{background:var(--surface);border-color:var(--border);color:var(--text);}
.btn-outline:hover{background:var(--surface-2);border-color:#D9CBB0;}
.btn-danger-o{background:var(--surface);border-color:var(--danger);color:var(--danger);}
.btn-danger-o:hover{background:var(--danger-bg);}
.btn-sm{padding:6.5px 12px;font-size:12.5px;}
.btn-icon{padding:7px;border-radius:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}

/* FORMS */
label{font-size:12.5px;color:var(--text-muted);display:block;margin-bottom:5px;font-weight:500;}
input,select,textarea{
  width:100%;font-family:'Tajawal',sans-serif;font-size:14px;color:var(--text);
  padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface-2);
  outline:none;transition:border-color .15s, box-shadow .15s, background .15s;
  -webkit-appearance:none;appearance:none;color-scheme:light dark;
}
input[type="checkbox"], input[type="radio"]{
  -webkit-appearance:auto;appearance:auto;width:16px;height:16px;padding:0;border:none;background:none;accent-color:var(--primary);cursor:pointer;
}
input:focus,select:focus,textarea:focus{border-color:var(--gold);background:var(--surface);box-shadow:0 0 0 3px rgba(212,166,87,.15);}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus,textarea:-webkit-autofill,select:-webkit-autofill{
  -webkit-text-fill-color:var(--text)!important;
  -webkit-box-shadow:0 0 0 1000px var(--surface-2) inset!important;
  transition:background-color 9999s ease-in-out 0s;
}
input:disabled{opacity:.7;cursor:not-allowed;}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{
  -webkit-text-fill-color:var(--text);
  -webkit-box-shadow:0 0 0px 1000px var(--surface-2) inset;
  transition:background-color 9999s ease-in-out 0s;
}
.field{margin-bottom:13px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

/* TABLE */
.table-wrap{overflow-x:auto;overflow-y:hidden;border:1px solid var(--border);border-radius:12px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{
  text-align:right;background:var(--surface-2);color:var(--text-muted);
  padding:11px 14px;font-weight:700;font-size:11px;white-space:nowrap;
  text-transform:uppercase;letter-spacing:.03em;border-bottom:1.5px solid var(--border);
}
tbody td{padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody tr{transition:background .12s;}
tbody tr:hover{background:var(--surface-2);}
tbody tr.row-selected{background:var(--primary-light)!important;}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;}
.product-card{
  position:relative;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;
  overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s, border-color .15s;
}
.product-card:hover{box-shadow:var(--shadow);border-color:var(--gold-light);}
.product-card.row-selected{border-color:var(--primary);background:var(--primary-light);}
.product-card-check{position:absolute;top:8px;inset-inline-start:8px;z-index:2;background:var(--surface);border-radius:6px;padding:2px;box-shadow:0 1px 4px rgba(0,0,0,.15);}
.product-card-check input{width:18px;height:18px;accent-color:var(--primary);cursor:pointer;margin:0;}
.product-card-img{
  width:100%;aspect-ratio:1/1;background:var(--surface-2);display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid var(--border);
}
.product-card-img img{width:100%;height:100%;object-fit:cover;}
.product-card-img svg{width:34px;height:34px;}
.product-card-body{padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:4px;}
.product-card-name{font-size:13px;font-weight:700;color:var(--text);text-align:left;white-space:normal;overflow-wrap:break-word;line-height:1.35;}
.product-card-meta{font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.product-card-price{font-size:15px;font-weight:700;color:var(--gold);margin-top:2px;}
.product-card-row{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--text-muted);margin-top:2px;}
.product-card-actions{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px;border-top:1px solid var(--border);background:var(--surface-2);}
.product-card-actions .btn{padding:5px;}
.product-card-actions .btn svg{width:14px;height:14px;}
td input[type="checkbox"], th input[type="checkbox"]{width:18px;height:18px;accent-color:var(--primary);cursor:pointer;margin:0;}
tbody tr:last-child td{border-bottom:none;}
.tnum{font-variant-numeric:tabular-nums;}

.badge{display:inline-block;padding:3.5px 11px;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.01em;}
.badge.paid{background:var(--success-bg);color:var(--success);}
.badge.partial{background:var(--warning-bg);color:var(--warning);}
.badge.unpaid{background:var(--danger-bg);color:var(--danger);}
.badge.low{background:var(--danger-bg);color:var(--danger);}
.badge.ok{background:var(--success-bg);color:var(--success);}
.badge.neutral{background:var(--surface-2);color:var(--text-muted);}

.search-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.search-bar input{max-width:260px;}

.empty{text-align:center;padding:50px 20px;color:var(--text-muted);}
.empty svg{width:46px;height:46px;stroke:var(--gold);margin-bottom:14px;}
.empty h3{margin:0 0 6px 0;color:var(--text);font-size:15.5px;}
.empty p{margin:0 0 16px 0;font-size:13px;}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(30,20,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto;}
.modal{background:var(--surface);border-radius:18px;max-width:640px;width:100%;padding:26px 28px;box-shadow:0 25px 60px rgba(30,20,20,.3);animation:modalIn .16s ease-out;}
@keyframes modalIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-head h2{margin:0;font-size:18px;color:var(--primary-dark);}
.modal-close{cursor:pointer;background:none;border:none;color:var(--text-muted);padding:6px;border-radius:8px;}
.modal-close:hover{background:var(--surface-2);}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border);}

.item-rows{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:10px;}
.item-row{display:grid;grid-template-columns:2.2fr 0.8fr 1fr 1fr 34px;gap:8px;padding:9px 10px;align-items:center;border-bottom:1px solid var(--border);background:var(--surface-2);}
.item-row:last-child{border-bottom:none;}
.item-row.head-row{background:var(--primary-light);font-size:11.5px;color:var(--primary-dark);font-weight:600;padding:8px 10px;}
.rm-btn{background:none;border:none;color:var(--danger);cursor:pointer;padding:5px;border-radius:6px;}
.rm-btn:hover{background:var(--danger-bg);}
.tot-line{display:flex;justify-content:space-between;padding:6px 2px;font-size:14px;}
.tot-line.grand{font-size:17px;font-weight:700;color:var(--primary-dark);border-top:1px dashed var(--border);margin-top:4px;padding-top:10px;}

.alert-bar{display:flex;align-items:center;gap:10px;background:var(--warning-bg);color:#8A5A0A;border:1px solid #F0D8A0;border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:13.5px;}
.alert-bar svg{width:18px;height:18px;stroke:var(--warning);flex:none;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#15161F;color:#F3E9DC;padding:11px 22px;border-radius:10px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:100;opacity:0;transition:opacity .25s;}
.toast.show{opacity:1;}
.setup-wrap{position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto;padding:40px 16px;}
.setup-card{max-width:660px;width:100%;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:30px 32px;box-shadow:var(--shadow);}
.setup-steps{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-muted);margin:6px 0 20px 0;padding-right:18px;line-height:2;}
.setup-sql{width:100%;font-family:monospace;font-size:12px;background:#15161F;color:#E9DCC8;border-radius:10px;padding:14px;border:none;resize:vertical;min-height:150px;direction:ltr;text-align:left;}
.setup-status{font-size:12.5px;padding:9px 12px;border-radius:8px;margin-top:10px;}
.setup-status.ok{background:var(--success-bg);color:var(--success);}
.setup-status.err{background:var(--danger-bg);color:var(--danger);}
.conn-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 12px;border-radius:99px;font-weight:600;}
.conn-pill.on{background:var(--success-bg);color:var(--success);}
.conn-pill.off{background:var(--warning-bg);color:var(--warning);}

.tabs{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--border);overflow-x:auto;}
.tab{padding:9px 16px;font-size:13.5px;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s, border-color .15s;font-weight:500;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--primary);border-color:var(--primary);font-weight:700;}

.mini-bars{display:flex;align-items:flex-end;gap:14px;height:170px;padding:16px 6px 10px 6px;position:relative;}
.mini-bars::before{content:'';position:absolute;left:6px;right:6px;bottom:38px;border-bottom:1.5px dashed var(--border);}
.mini-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;}
.mini-bar-val{font-size:11px;color:var(--text-muted);font-weight:600;opacity:0;transform:translateY(4px);transition:opacity .2s, transform .2s;}
.mini-bar-col:hover .mini-bar-val{opacity:1;transform:translateY(0);}
.mini-bar-wrap{width:100%;display:flex;justify-content:center;position:relative;}
.mini-bar{
  width:62%;border-radius:8px 8px 3px 3px;min-height:4px;
  background:linear-gradient(180deg,var(--gold-light),var(--gold));
  box-shadow:0 3px 8px rgba(212,166,87,.25);
  transform:scaleY(0);transform-origin:bottom;
  animation:barGrow .6s cubic-bezier(.22,1,.36,1) forwards;
  transition:filter .15s, box-shadow .15s;
  cursor:default;
}
.mini-bar-col:hover .mini-bar{filter:brightness(1.08);box-shadow:0 5px 14px rgba(212,166,87,.4);}
.mini-bar.is-current{background:linear-gradient(180deg,#F0568C,#D4396E);box-shadow:0 3px 8px rgba(212,57,110,.3);}
.mini-bar-col:hover .mini-bar.is-current{box-shadow:0 5px 14px rgba(212,57,110,.45);}
@keyframes barGrow{ to{ transform:scaleY(1); } }
.mini-bar-lbl{font-size:11px;color:var(--text-muted);font-weight:500;}
.mini-bar-col.is-current-col .mini-bar-lbl{color:var(--primary-dark);font-weight:700;}

.print-only{display:none;}
@page{ margin:14mm; }
@media print{
  @page{ size:auto; margin:12mm; }
  html, body{width:auto !important; min-width:0 !important;}
  body{background:#fff !important;}
  #app, #modalRoot, #toast{display:none !important;}
  #printArea{display:block !important;width:100% !important;direction:ltr !important;margin:0 !important;padding:0 !important;}
  .print-only{display:block !important;}
}
.inv-print{
  max-width:800px;margin:0 auto;background:#fff;color:#1a1a1a;
  font-family:'Poppins',sans-serif;padding:50px 55px;direction:ltr;
  font-size:13px;line-height:1.65;
  min-height:100vh;display:flex;flex-direction:column;
}
.inv-print .en{font-family:'Poppins',sans-serif;direction:ltr;unicode-bidi:plaintext;}
.doc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.doc-logo-block{display:flex;flex-direction:column;align-items:flex-start;gap:3px;}
.doc-logo-img{width:46px;height:46px;border-radius:9px;object-fit:cover;flex:none;}
.doc-logo-placeholder{width:46px;height:46px;border-radius:9px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;color:#1a1a1a;flex:none;font-family:'El Messiri',serif;font-weight:700;font-size:19px;}
.doc-company-name{font-family:'El Messiri',serif;font-weight:700;font-size:17px;color:#1a1a1a;}
.doc-company-addr{font-size:11.5px;color:#444;line-height:1.7;text-align:left;}
.doc-title{font-family:'El Messiri',serif;font-size:22px;color:#1a1a1a;font-weight:700;margin:10px 0 10px 0;}
.doc-title .en{display:block;font-size:12px;font-weight:500;margin-top:2px;}
.doc-bill-to{margin-bottom:12px;}
.doc-bill-to .lbl{font-weight:700;font-size:11px;color:#1a1a1a;margin-bottom:5px;}
.doc-bill-to .lbl .en{display:block;font-weight:400;}
.doc-bill-to .nm{font-weight:700;font-size:13px;color:#1a1a1a;}
.doc-bill-to .ln{font-size:12px;color:#444;margin-top:2px;}
.doc-meta-row{display:flex;gap:46px;margin-bottom:14px;flex-wrap:wrap;}
.doc-meta-lbl{font-weight:700;font-size:11.5px;color:#1a1a1a;margin-bottom:4px;}
.doc-meta-lbl .en{display:block;font-weight:400;}
.doc-meta-val{font-size:12.5px;color:#333;}
table.doc-table{width:100%;border-collapse:collapse;margin-bottom:4px;}
table.doc-table thead th{text-align:right;font-size:11.5px;font-weight:700;color:#1a1a1a;padding:0 5px 8px 5px;border-bottom:1.5px solid #1a1a1a;}
table.doc-table thead th.num{text-align:left;}
table.doc-table thead th .en{display:block;font-weight:400;font-size:.85em;}
table.doc-table td{padding:6px 5px;border-bottom:1px solid #eee;font-size:12.5px;vertical-align:top;color:#1a1a1a;}
table.doc-table td.num{font-family:'Poppins',sans-serif;direction:ltr;text-align:left;white-space:nowrap;}
table.doc-table.cells-left thead th{text-align:left;}
table.doc-table.cells-left td{text-align:left;}
.doc-desc{max-width:230px;white-space:normal;overflow-wrap:break-word;line-height:1.35;}
.doc-item-sub{font-size:11px;color:#999;margin-top:1px;line-height:1.3;}
.doc-totals-wrap{display:flex;justify-content:flex-end;margin:6px 0 16px 0;}
.doc-totals{min-width:250px;}
.doc-totals-row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-top:1px solid #eee;font-size:12.5px;color:#333;}
.doc-totals-row .en{display:block;font-size:.85em;}
.doc-totals-row:first-child{border-top:1.5px solid #1a1a1a;}
.doc-totals-row.grand{font-weight:700;color:#1a1a1a;font-size:14.5px;border-top:1.5px solid #1a1a1a;}
.doc-totals-row .val{font-family:'Poppins',sans-serif;direction:ltr;}
.doc-notes{font-size:12px;color:#333;margin-bottom:20px;line-height:1.7;}
.doc-notes a{color:#1a1a1a;}
.doc-notes b{color:#1a1a1a;}
.doc-footer{border-top:1px solid #ddd;padding-top:12px;text-align:center;font-size:11px;color:#555;margin-top:auto;padding-top:12px;direction:ltr;font-family:'Poppins',sans-serif;}
.doc-footer-page{font-size:10px;color:#999;margin-top:4px;}
.label-sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px;direction:rtl;}
.label-item{border:1px dashed #999;border-radius:6px;padding:10px 6px;text-align:center;font-family:'Tajawal',sans-serif;color:#1a1a1a;}
.label-co{font-size:9px;color:#888;margin-bottom:3px;}
.label-name{font-size:11px;font-weight:700;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.label-price{font-size:14px;font-weight:700;margin-bottom:6px;font-family:'Poppins',sans-serif;}
.label-code{font-family:monospace;font-size:15px;letter-spacing:2px;border-top:1px dashed #ccc;padding-top:6px;direction:ltr;}
@media screen and (max-width:980px){
  .brand-titles{display:none;}
  .topnav-btn span:not(.chev){display:none;}
  .topnav-btn{padding:10px;}
  .content{padding:16px;}
  .page-header{padding:12px 16px;}
  .topdate{display:none;}
  .row2,.row3{grid-template-columns:1fr;}
  .item-row{grid-template-columns:1.6fr .7fr .8fr .8fr 28px;font-size:12.5px;}
}
@media screen and (max-width:640px){
  input,select,textarea{font-size:16px;}
  .topnav{padding:0 10px;gap:6px;height:56px;}
  .topnav-brand{gap:6px;}
  .brand-mark{width:32px;height:32px;font-size:14px;}
  .page-header{top:56px;padding:10px 14px;}
  .page-header h1{font-size:16.5px;}
  .page-header .sub{display:none;}
  .content{padding:10px;}
  .card{padding:14px 14px;margin-bottom:14px;}
  .card-head{flex-direction:column;align-items:stretch;gap:10px;}
  .card-head h2{font-size:14.5px;}
  .card-head > div{flex-wrap:wrap;}
  .btn{padding:8px 12px;font-size:12.5px;}
  .btn-sm{padding:6px 10px;font-size:11.5px;}
  .stat-grid{grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card{padding:12px 14px;}
  .stat-card .val{font-size:18px;}
  table{font-size:12px;}
  thead th{padding:8px 10px;font-size:9.5px;}
  tbody td{padding:9px 10px;}
  td, td.tnum{white-space:nowrap;}
  .modal{max-width:100%;width:100%;height:100%;max-height:100%;border-radius:0;padding:16px;}
  .overlay{padding:0;align-items:stretch;}
  .topnav-dropdown{left:8px!important;right:8px!important;min-width:0;width:auto;}
  [dir="ltr"] .topnav-dropdown{left:8px!important;right:8px!important;}
  .search-bar{flex-direction:column;}
  .search-bar select{max-width:100%!important;}
  .item-row{grid-template-columns:1fr;gap:6px;padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--surface-2);}
  .item-row.head-row{display:none;}
  .doc-desc{max-width:none;}
  .logout-btn{padding:6px;}
  .sidebar-userbar,.topnav-userbar{padding-left:6px;padding-right:6px;}
}
.mobile-menu-btn{display:none;}
.mobile-drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:150;}
.mobile-drawer-overlay.open{display:block;}
.mobile-drawer{
  position:fixed;top:0;right:0;height:100vh;width:280px;max-width:82vw;
  background:var(--sidebar);color:var(--sidebar-text);z-index:151;
  transform:translateX(100%);transition:transform .22s ease;
  display:flex;flex-direction:column;overflow-y:auto;
}
[dir="ltr"] .mobile-drawer{right:auto;left:0;transform:translateX(-100%);}
.mobile-drawer.open{transform:translateX(0);}
.mobile-drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid rgba(255,255,255,.1);color:#F3E9DC;}
.mobile-drawer-head .btn{color:var(--sidebar-text);border-color:rgba(255,255,255,.15);}
.mobile-nav-group-lbl{font-size:10.5px;color:var(--gold-light);opacity:.8;font-weight:700;letter-spacing:.04em;padding:14px 16px 6px 16px;}
.mobile-navitem{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;font-size:14px;color:var(--sidebar-text);user-select:none;}
.mobile-navitem svg{width:19px;height:19px;stroke:currentColor;flex:none;}
.mobile-navitem:active,.mobile-navitem.active{background:rgba(212,166,87,.18);color:var(--gold-light);}
@media screen and (max-width:980px){
  .topnav-menu{display:none;}
  .mobile-menu-btn{display:flex;padding:7px;}
}
</style>

let SUPA = { url:'', key:'' };

function loadSupaConfig(){

function cleanSupaUrl(url){
  return (url||'').trim().replace(/\/rest\/v1\/?.*$/i,'').replace(/\/+$/,'');
}
function saveSupaConfig(url,key){
  SUPA = { url:cleanSupaUrl(url), key:(key||'').trim() };
  localStorage.setItem('zib_supa_config', JSON.stringify(SUPA));

  LOCAL_MODE = false;
}

}

/* ============ AUTH (Supabase Auth: username+password) ============ */
let AUTH_SESSION = null;
function loadAuthSession(){
  try{ const raw = localStorage.getItem('zib_auth_session'); if(raw) AUTH_SESSION = JSON.parse(raw); }catch(e){}
}
function persistAuthSession(){
  try{ localStorage.setItem('zib_auth_session', JSON.stringify(AUTH_SESSION)); }catch(e){}
}
function logoutUser(){
  AUTH_SESSION = null;
  try{ localStorage.removeItem('zib_auth_session'); }catch(e){}
  location.reload();
}
function usernameToEmail(u){ return (u||'').trim().toLowerCase().replace(/[^a-z0-9_.-]/g,'')+'@zib-local.app'; }
async function supaAuthRequest(path, body){
  const res = await fetch(SUPA.url+path, {
    method:'POST',
    headers:{ 'apikey':SUPA.key, 'Authorization':'Bearer '+SUPA.key, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok){ throw new Error(data.error_description || data.msg || data.error || ('HTTP '+res.status)); }
  return data;
}
async function authSignUp(username, password, fullName, role, permissions){
  const email = usernameToEmail(username);
  const data = await supaAuthRequest('/auth/v1/signup', {email, password});
  if(!data.access_token || !data.user){
    throw new Error('لم يتم الدخول تلقائياً بعد إنشاء الحساب - تأكد إن خاصية "Confirm email" متوقفة من إعدادات Supabase (Authentication → Providers → Email)');
  }
  const res = await fetch(SUPA.url+'/rest/v1/zib_users', {
    method:'POST',
    headers:{ 'apikey':SUPA.key, 'Authorization':'Bearer '+data.access_token, 'Content-Type':'application/json', 'Prefer':'return=representation' },
    body: JSON.stringify([{id:data.user.id, username:username.trim(), full_name:(fullName||username).trim(), role:role||'employee', permissions:permissions||{}}])
  });
  if(!res.ok){ const t = await res.text().catch(()=>''); throw new Error('فشل حفظ بيانات المستخدم: '+t); }
  return data;
}
async function authLogin(username, password){
  const email = usernameToEmail(username);
  const data = await supaAuthRequest('/auth/v1/token?grant_type=password', {email, password});
  if(!data.access_token) throw new Error('اسم المستخدم أو كلمة المرور غير صحيحة');
  let profile = {username, full_name:username, role:'employee'};
  try{
    const res = await fetch(SUPA.url+'/rest/v1/zib_users?id=eq.'+data.user.id+'&select=*', {
      headers:{ 'apikey':SUPA.key, 'Authorization':'Bearer '+data.access_token }
    });
    const rows = await res.json().catch(()=>[]);
    if(rows && rows[0]) profile = rows[0];
  }catch(e){}
  return {...data, profile};
}
async function tryRefreshSession(){
  if(!AUTH_SESSION || !AUTH_SESSION.refresh_token){ logoutUser(); return false; }
  try{
    const data = await supaAuthRequest('/auth/v1/token?grant_type=refresh_token', {refresh_token:AUTH_SESSION.refresh_token});
    if(data.access_token){
      AUTH_SESSION.access_token = data.access_token;
      AUTH_SESSION.refresh_token = data.refresh_token || AUTH_SESSION.refresh_token;
      persistAuthSession();
      return true;
    }
  }catch(e){}
  logoutUser();
  return false;
}
let sessionKeepAliveInterval = null;
function startSessionKeepAlive(){
  if(sessionKeepAliveInterval) clearInterval(sessionKeepAliveInterval);
  sessionKeepAliveInterval = setInterval(()=>{
    if(AUTH_SESSION && AUTH_SESSION.refresh_token) tryRefreshSession();
  }, 20*60*1000);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible' && AUTH_SESSION && AUTH_SESSION.refresh_token) tryRefreshSession();
  });
}

async function supaRequest(path, opts, _retried){
  const token = (AUTH_SESSION && AUTH_SESSION.access_token) ? AUTH_SESSION.access_token : SUPA.key;
  const res = await fetch(SUPA.url + path, {
    ...opts,
    headers:{
      'apikey': SUPA.key,
      'Authorization':'Bearer '+token,
      'Content-Type':'application/json',
      ...(opts&&opts.headers?opts.headers:{})
    }
  });
  if(res.status===401 && !_retried && AUTH_SESSION){
    const ok = await tryRefreshSession();
    if(ok) return supaRequest(path, opts, true);
  }
  if(!res.ok){
    const txt = await res.text().catch(()=> '');
    throw new Error('HTTP '+res.status+' '+txt);
  }
  if(res.status===204) return null;
  const txt = await res.text().catch(()=> '');
  if(!txt) return null;
  try{ return JSON.parse(txt); }catch(e){ return null; }
}
async function loadKey(key, def){
  if(isOnlineConfigured() && !LOCAL_MODE){
    try{
      const rows = await supaRequest('/rest/v1/zib_data?key=eq.'+encodeURIComponent(key)+'&select=value', {method:'GET'});
      if(rows && rows.length) return rows[0].value;
      return def;
    }catch(e){ console.error('supabase load failed', key, e); toast('تعذر الاتصال بقاعدة البيانات - جارٍ استخدام آخر نسخة محفوظة'); }
  }
  try{
    if(window.storage && typeof window.storage.get==='function'){
      const r = await window.storage.get(key,false);
      return r && r.value ? JSON.parse(r.value) : def;
    }
  }catch(e){}
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : def;
  }catch(e){ return def; }
}
async function saveKey(key,val){
  if(isOnlineConfigured() && !LOCAL_MODE){
    try{
      await supaRequest('/rest/v1/zib_data', {
        method:'POST',
        headers:{ 'Prefer':'resolution=merge-duplicates' },
        body: JSON.stringify([{key, value:val}])
      });
    }catch(e){ console.error('supabase save failed', key, e); toast('تعذر حفظ البيانات على السيرفر - تحقق من الاتصال'); }
    return;
  }
  try{
    if(window.storage && typeof window.storage.set==='function'){
      await window.storage.set(key, JSON.stringify(val), false);
      return;
    }
  }catch(e){}
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ console.error('save failed',key,e); }
}

let DB_BASELINE = {};
let persistQueue = {};
function deepClone(x){ return x==null ? x : JSON.parse(JSON.stringify(x)); }
function mergeArrayCollection(remote, local, baseline){
  if(!Array.isArray(remote) || !Array.isArray(local)) return local;
  if(!Array.isArray(baseline)) baseline = [];
  const remoteMap = new Map(remote.map(x=>[x.id, x]));
  const baselineMap = new Map(baseline.map(x=>[x.id, x]));
  const localMap = new Map(local.map(x=>[x.id, x]));
  const result = new Map(remoteMap);
  localMap.forEach((item, id)=>{
    const baseItem = baselineMap.get(id);
    if(!baseItem || JSON.stringify(baseItem)!==JSON.stringify(item)){
      result.set(id, item);
    }
  });
  baselineMap.forEach((_, id)=>{
    if(!localMap.has(id)) result.delete(id);
  });
  return Array.from(result.values());
}
function mergeSettingsObject(remote, local, baseline){
  if(typeof remote!=='object' || remote===null) return local;
  const merged = {...remote};
  Object.keys(local||{}).forEach(k=>{
    const baseVal = baseline ? baseline[k] : undefined;
    if(JSON.stringify(baseVal)!==JSON.stringify(local[k])){
      merged[k] = local[k];
    }
  });
  return merged;
}
const PERSIST_KEY_MAP = {
  products:'zib_products', customers:'zib_customers', suppliers:'zib_suppliers',
  sales:'zib_sales', purchases:'zib_purchases', returns:'zib_returns', quotations:'zib_quotations', stockMoves:'zib_stock_moves',
  consignShipments:'zib_consign_shipments', consignReports:'zib_consign_reports', testerHandouts:'zib_tester_handouts', expenses:'zib_expenses', productGroups:'zib_product_groups', crmActivities:'zib_crm_activities', purchaseOrders:'zib_purchase_orders', warehouses:'zib_warehouses', salesReps:'zib_sales_reps', custodies:'zib_custodies', custodyEntries:'zib_custody_entries', boms:'zib_boms', productionOrders:'zib_production_orders', landedCosts:'zib_landed_costs', comments:'zib_comments', accounts:'zib_accounts', journal:'zib_journal',
  activityLog:'zib_activity_log', settings:'zib_settings'
};
function persist(part){
  if(!part) return;
  const key = PERSIST_KEY_MAP[part];
  if(!key) return;
  const prev = persistQueue[part] || Promise.resolve();
  persistQueue[part] = prev.then(()=>persistPart(part, key)).catch(e=>console.error('persist chain error', part, e));
}
async function persistPart(part, key){
  if(!isOnlineConfigured() || LOCAL_MODE){
    await saveKey(key, DB[part]);
    DB_BASELINE[part] = deepClone(DB[part]);
    return;
  }
  const localSnapshot = deepClone(DB[part]);
  const baselineSnapshot = DB_BASELINE[part]!==undefined ? DB_BASELINE[part] : localSnapshot;
  let remote;
  try{ remote = await loadKey(key, localSnapshot); }catch(e){ remote = localSnapshot; }
  let merged;
  if(Array.isArray(localSnapshot)) merged = mergeArrayCollection(remote, localSnapshot, baselineSnapshot);
  else if(typeof localSnapshot==='object' && localSnapshot!==null) merged = mergeSettingsObject(remote, localSnapshot, baselineSnapshot);
  else merged = localSnapshot;
  const remoteChangedByOthers = JSON.stringify(remote)!==JSON.stringify(baselineSnapshot);
  DB[part] = merged;
  DB_BASELINE[part] = deepClone(merged);
  await saveKey(key, merged);
  if(remoteChangedByOthers && LOADED && VIEW) render();
}

function partyAdvanceBalance(kind, partyId){
  const accId = kind==='customers' ? 'acc_cust_adv' : 'acc_supp_adv';
  const partyType = kind==='customers' ? 'customer' : 'supplier';
  let debit=0, credit=0;
  DB.journal.forEach(j=> j.lines.forEach(l=>{
    if(l.accountId===accId && l.partyType===partyType && l.partyId===partyId){ debit+=l.debit||0; credit+=l.credit||0; }
  }));
  return kind==='customers' ? (credit-debit) : (debit-credit);
}

function positionOpenDropdown(){
  if(openDropdownIdx===null) return;

  const dropdown = openItem.querySelector('.topnav-dropdown');
  if(!btn || !dropdown) return;
  const rect = btn.getBoundingClientRect();
  dropdown.style.top = (rect.bottom+8)+'px';
  if(document.documentElement.dir==='rtl'){
    dropdown.style.right = Math.max(8, window.innerWidth-rect.right)+'px';

function reportMonthlyTrend(){
  const list = DB.sales.filter(s=>inRange(s.date));
  if(list.length===0) return emptyState('لا توجد بيانات', 'لا توجد فواتير مبيعات ضمن الفترة المحددة');
  const byMonth = {};
  list.forEach(s=>{
    const key = s.date.slice(0,7);
    if(!byMonth[key]) byMonth[key] = {count:0, total:0};
    byMonth[key].count++;
    byMonth[key].total += s.total;
  });
  const months = Object.keys(byMonth).sort();
  const maxVal = Math.max(...months.map(m=>byMonth[m].total), 1);
  return `
    <div class="table-wrap"><table>
      <thead><tr><th>الشهر</th><th>عدد الفواتير</th><th>الإجمالي</th><th></th></tr></thead>
      <tbody>${months.map(m=>`<tr>
        <td>${m}</td><td class="tnum">${byMonth[m].count}</td><td class="tnum">${money(byMonth[m].total)}</td>
        <td style="width:200px;"><div style="background:var(--gold);height:10px;border-radius:5px;width:${(byMonth[m].total/maxVal*100).toFixed(0)}%;"></div></td>
      </tr>`).join('')}</tbody>
    </table></div>
  `;
}
function reportSalesForecast(){
  const byMonth = {};
  DB.sales.forEach(s=>{
    const key = s.date.slice(0,7);
    byMonth[key] = (byMonth[key]||0) + s.total;
  });
  const months = Object.keys(byMonth).sort();
  if(months.length<2){
    return emptyState('بيانات غير كافية للتوقع','محتاج على الأقل شهرين من المبيعات الفعلية عشان نقدر نحسب اتجاه موثوق');
  }
  const recentMonths = months.slice(-12);
  const n = recentMonths.length;
  const xs = recentMonths.map((_,i)=>i);
  const ys = recentMonths.map(m=>byMonth[m]);
  const sumX = xs.reduce((a,b)=>a+b,0);
  const sumY = ys.reduce((a,b)=>a+b,0);
  const sumXY = xs.reduce((s,x,i)=>s+x*ys[i],0);
  const sumX2 = xs.reduce((s,x)=>s+x*x,0);
  const denom = (n*sumX2 - sumX*sumX);
  const slope = denom!==0 ? (n*sumXY - sumX*sumY)/denom : 0;
  const intercept = (sumY - slope*sumX)/n;
  const lastMonthKey = recentMonths[recentMonths.length-1];
  const [ly, lm] = lastMonthKey.split('-').map(Number);
  const forecasts = [];
  for(let i=1;i<=3;i++){
    const x = n-1+i;
    let val = slope*x + intercept;
    if(val<0) val = 0;
    let fy = ly, fm = lm+i;
    while(fm>12){ fm-=12; fy++; }
    forecasts.push({month: fy+'-'+String(fm).padStart(2,'0'), value: val});
  }
  const avgRecent = ys.slice(-3).reduce((a,b)=>a+b,0) / Math.min(3, ys.length);
  const trendLabel = slope>0.02*Math.max(avgRecent,1) ? 'اتجاه تصاعدي 📈' : (slope<-0.02*Math.max(avgRecent,1) ? 'اتجاه تنازلي 📉' : 'مستقر تقريباً ➡️');
  return `
    <div class="stat-grid" style="margin-bottom:16px;">
      <div class="stat-card"><div class="lbl">الاتجاه العام</div><div class="val" style="font-size:16px;">${trendLabel}</div></div>
      <div class="stat-card gold"><div class="lbl">متوسط آخر 3 شهور فعلية</div><div class="val">${money(avgRecent)}</div></div>
    </div>
    <p style="font-size:12px;color:var(--text-muted);">التوقع مبني على تحليل الاتجاه الخطي لآخر ${n} شهر من مبيعاتك الفعلية. ده تقدير تقريبي للمساعدة في التخطيط، مش رقم مؤكد — كل ما بياناتك التاريخية أكتر، كل ما التوقع يبقى أدق.</p>
    <h3 style="font-size:14.5px;color:var(--primary-dark);margin-top:16px;">البيانات الفعلية (آخر ${n} شهر)</h3>
    <div class="table-wrap"><table>
      <thead><tr><th>الشهر</th><th>المبيعات الفعلية</th></tr></thead>
      <tbody>${recentMonths.map(m=>`<tr><td>${m}</td><td class="tnum">${money(byMonth[m])}</td></tr>`).join('')}</tbody>
    </table></div>
    <h3 style="font-size:14.5px;color:var(--gold);margin-top:16px;">${icon('alert')} التوقع للشهور القادمة (تقديري)</h3>
    <div class="table-wrap"><table>
      <thead><tr><th>الشهر</th><th>المبيعات المتوقعة</th></tr></thead>
      <tbody>${forecasts.map(f=>`<tr><td>${f.month}</td><td class="tnum" style="font-weight:700;color:#8A6220;">${money(f.value)}</td></tr>`).join('')}</tbody>
    </table></div>
  `;
}
function reportCommissions(){
  const invs = DB.sales.filter(s=>s.salesRepId && (!repFrom || s.date>=repFrom) && (!repTo || s.date<=repTo));
  const byRep = {};
  invs.forEach(s=>{
    if(!byRep[s.salesRepId]) byRep[s.salesRepId] = {name:s.salesRepName, total:0, count:0};
    byRep[s.salesRepId].total += s.total;
    byRep[s.salesRepId].count += 1;
  });
  const rows = DB.salesReps.map(r=>{

    const commission = type==='fixed' ? val*d.count : d.total*val/100;
    return {name:r.name, count:d.count, sales:d.total, commission, type, val};
  }).filter(r=>r.count>0 || DB.salesReps.length<=15);
  if(rows.length===0) return emptyState('لا يوجد مندوبين مسجلين','أضف مندوبين من الإعدادات أولاً', false);

      </tbody>

}

function toggleMobileDrawer(){
  const drawer = document.getElementById('mobileDrawer');
  const overlay = document.getElementById('mobileDrawerOverlay');
  if(!drawer) return;
  const isOpen = drawer.classList.contains('open');
  if(isOpen) closeMobileDrawer();
  else{ drawer.classList.add('open'); overlay.classList.add('open'); }
}
function closeMobileDrawer(){
  const drawer = document.getElementById('mobileDrawer');
  const overlay = document.getElementById('mobileDrawerOverlay');
  if(drawer) drawer.classList.remove('open');

}

/* ============ DASHBOARD ============ */
function renderDashboard(){
  const totalSales = DB.sales.reduce((s,i)=>s+i.total,0);
  const totalPurchases = DB.purchases.reduce((s,i)=>s+i.total,0);
  const stockValue = DB.products.reduce((s,p)=>s+p.quantity*p.purchasePrice,0);
  const dueFromCustomers = DB.sales.reduce((s,i)=>s+(i.total-i.paidAmount),0);
  const dueToSuppliers = DB.purchases.reduce((s,i)=>s+(i.total-i.paidAmount),0);
  const lowStock = DB.products.filter(p=>p.quantity<=p.reorderLevel);
  const consignBalances = consignCustomerBalances();
  const consignQty = consignBalances.reduce((s,b)=>s+b.qty,0);
  const consignCost = consignBalances.reduce((s,b)=>s+b.value,0);

  // last 6 months sales
  const months = [];
  const now = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'), label:d.toLocaleDateString('ar-EG-u-nu-latn',{month:'short'})});
  }
  const monthTotals = months.map(m=>{
    const t = DB.sales.filter(s=>s.date && s.date.slice(0,7)===m.key).reduce((a,s)=>a+s.total,0);
    return {...m, total:t};
  });
  const maxVal = Math.max(1, ...monthTotals.map(m=>m.total));

  const recentSales = [...DB.sales].sort((a,b)=>b.createdAt-a.createdAt).slice(0,5);

  return `
    ${lowStock.length ? `<div class="alert-bar">${icon('alert')}<div>يوجد <b>${lowStock.length}</b> منتج${lowStock.length>1?'ات':''} وصلت لحد إعادة الطلب أو أقل — راجع صفحة <a href="#" onclick="goTo('inventory');return false;" style="color:var(--primary-dark);font-weight:600;">المخزون</a></div></div>` : ''}
    <div class="stat-grid">
      <div class="stat-card rose"><div class="lbl">${icon('sales')} إجمالي المبيعات</div><div class="val">${money(totalSales)}</div></div>
      <div class="stat-card gold"><div class="lbl">${icon('purchases')} إجمالي المشتريات</div><div class="val">${money(totalPurchases)}</div></div>
      <div class="stat-card"><div class="lbl">${icon('inventory')} قيمة المخزون الحالي</div><div class="val">${money(stockValue)}</div></div>
      <div class="stat-card green"><div class="lbl">${icon('money')} مستحق من العملاء</div><div class="val">${money(dueFromCustomers)}</div></div>
      <div class="stat-card red"><div class="lbl">${icon('money')} مستحق للموردين</div><div class="val">${money(dueToSuppliers)}</div></div>
      <div class="stat-card"><div class="lbl">${icon('consign')} رصيد البيع بالأمانة (كمية)</div><div class="val">${fmt(consignQty)}</div></div>
      <div class="stat-card gold"><div class="lbl">${icon('consign')} تكلفة بضاعة الأمانة</div><div class="val">${money(consignCost)}</div></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>حركة المبيعات - آخر 6 أشهر</h2></div>
      <div class="mini-bars">
        ${monthTotals.map((m,mi)=>{
          const isCurrent = mi===monthTotals.length-1;
          return `
          <div class="mini-bar-col ${isCurrent?'is-current-col':''}">
            <div class="mini-bar-val">${money(m.total)}</div>
            <div class="mini-bar-wrap"><div class="mini-bar ${isCurrent?'is-current':''}" style="height:${Math.max(4,(m.total/maxVal)*118)}px;animation-delay:${mi*0.06}s;"></div></div>
            <div class="mini-bar-lbl">${m.label}</div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>أحدث فواتير المبيعات</h2><span class="hint" onclick="goTo('sales')" style="cursor:pointer;color:var(--primary);">عرض الكل ←</span></div>
      ${recentSales.length===0 ? emptyState('لا توجد فواتير بعد','ابدأ بتسجيل أول عملية بيع','sales','sales') : `
      <div class="table-wrap"><table>
        <thead><tr><th>رقم الفاتورة</th><th>العميل</th><th>التاريخ</th><th>الإجمالي</th><th>الحالة</th></tr></thead>
        <tbody>${recentSales.map(s=>`
          <tr><td>${s.number}</td><td>${esc(s.partyName)}</td><td>${fmtDate(s.date)}</td><td class="tnum">${money(s.total)}</td><td>${statusBadge(s)}</td></tr>
        `).join('')}</tbody>
      </table></div>`}
    </div>
  `;
}
function statusBadge(inv){
  const due = inv.total - inv.paidAmount;
  if(due<=0.009) return `<span class="badge paid">مدفوعة</span>`;
  if(inv.paidAmount>0) return `<span class="badge partial">جزئية</span>`;
  return `<span class="badge unpaid">غير مدفوعة</span>`;
}
function emptyState(title, desc, addAction, kind){
  return `<div class="empty">${icon('inventory')}<h3>${title}</h3><p>${desc}</p>
    ${addAction ? `<button class="btn btn-primary" onclick="${kind==='sales'?'openSaleModal()':kind==='purchases'?'openPurchaseModal()':kind==='product'?'openProductModal()':kind==='customer'?"openPartyModal('customers')":kind==='supplier'?"openPartyModal('suppliers')":kind==='expense'?'openExpenseModal()':''}">${icon('plus')} إضافة</button>`:''}
  </div>`;
}

function warehouseStockFor(productId, warehouseId){
  const p = productById(productId);
  if(!p) return 0;
  if(!p.stockByWarehouse) return warehouseId==='wh_main' ? p.quantity : 0;
  return p.stockByWarehouse[warehouseId]||0;
}
function ensureWarehouseInit(p){
  if(!p.stockByWarehouse){ p.stockByWarehouse = {wh_main: p.quantity}; }
}

              <button class="btn btn-primary btn-sm" onclick="closeModal(); goTo('production'); openProductionOrderModal(null,'${b.id}');">${icon('plus')} أمر تصنيع</button>
              <button class="btn btn-outline btn-icon btn-sm" onclick="openBomModal('${b.id}')" title="تعديل">${icon('edit')}</button>
              ${can('delete_records')?`<button class="btn btn-danger-o btn-icon btn-sm" onclick="deleteBom('${b.id}')">${icon('trash')}</button>`:''}
            </td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>`}
    </div>
  `;
}
function openBomModal(editId){
  const b = editId ? DB.boms.find(x=>x.id===editId) : null;
  const finishedProducts = saleOnlyProducts(b?[b.productId]:[]);
  const rawMaterials = purchaseOnlyProducts(b?b.items.map(it=>it.materialId):[]);
  const productOpts = finishedProducts.map(p=>`<option value="${p.id}" ${b&&b.productId===p.id?'selected':''}>${esc(p.name)}</option>`).join('');
  const materialOpts = rawMaterials.map(p=>`<option value="${p.id}" data-cost="${p.purchasePrice}">${esc(p.name)}</option>`).join('');
  window._bomMaterialOpts = materialOpts;
  const body = `
    <div class="field"><label>اسم الوصفة *</label><input id="f_name" value="${b?esc(b.name):''}" placeholder="مثال: وصفة كريم الترطيب 500 مل"></div>
    <div class="row2">
      <div class="field"><label>المنتج الناتج (الجاهز) *</label><select id="f_product">${finishedProducts.length?'<option value="">اختر...</option>'+productOpts:'<option value="">لا توجد منتجات "بيع فقط" - عدّل نوع منتج من المخزون أولاً</option>'}</select></div>
      <div class="field"><label>الكمية الناتجة لكل دورة تصنيع *</label><input id="f_output" type="number" min="0.01" step="0.01" value="${b?b.outputQty:1}"></div>
    </div>
    <label>المواد الخام المطلوبة (لكمية دورة واحدة زي ما محددة فوق)</label>
    <div class="item-rows" id="bomRows">
      <div class="item-row head-row" style="grid-template-columns:2.5fr 1fr 34px;"><div>المادة الخام</div><div>الكمية اللازمة</div><div></div></div>
    </div>
    <button class="btn btn-outline btn-sm" type="button" onclick="addBomRow()">${icon('plus')} إضافة مادة خام</button>
    <div class="field" style="margin-top:10px;"><label>ملاحظات</label><input id="f_notes" value="${b?esc(b.notes||''):''}"></div>
  `;
  openModal(b?'تعديل وصفة تصنيع':'وصفة تصنيع جديدة', body, ()=>{
    const name = document.getElementById('f_name').value.trim();
    if(!name){ toast('اكتب اسم الوصفة'); return false; }
    const productId = document.getElementById('f_product').value;
    if(!productId){ toast('اختر المنتج الناتج'); return false; }
    const outputQty = parseFloat(document.getElementById('f_output').value)||0;
    if(outputQty<=0){ toast('أدخل كمية ناتجة صحيحة'); return false; }
    const product = productById(productId);
    const rows = Array.from(document.querySelectorAll('#bomRows .item-row:not(.head-row)'));
    const items = [];
    rows.forEach(row=>{
      const sel = row.querySelector('.sel-material');
      if(!sel.value) return;
      const mat = productById(sel.value);
      const qty = parseFloat(row.querySelector('.inp-qty').value)||0;
      if(qty<=0) return;
      items.push({materialId:mat.id, name:mat.name, qty});
    });
    if(items.length===0){ toast('أضف مادة خام واحدة على الأقل'); return false; }
    if(items.some(it=>it.materialId===productId)){ toast('المنتج الناتج ميقدرش يكون هو نفسه مادة خام في نفس الوصفة'); return false; }
    const notes = document.getElementById('f_notes').value.trim();
    if(b){
      Object.assign(b, {name, productId, productName:product.name, outputQty, items, notes});
      logActivity('bom', 'تعديل وصفة تصنيع: '+name);
    }else{
      DB.boms.push({ id:uid(), number:nextNumber(DB.boms,'BOM'), name, productId, productName:product.name, outputQty, items, notes, createdAt:Date.now(), createdBy:currentUserName() });
      logActivity('bom', 'إنشاء وصفة تصنيع: '+name);
    }
    persist('boms');
    closeModal(); render(); toast('تم الحفظ بنجاح');
  });
  if(b && b.items.length){
    b.items.forEach(()=>addBomRow());
    setTimeout(()=>{
      const rows = document.querySelectorAll('#bomRows .item-row:not(.head-row)');
      b.items.forEach((it,i)=>{
        const row = rows[i]; if(!row) return;
        row.querySelector('.sel-material').value = it.materialId;
        row.querySelector('.inp-qty').value = it.qty;
      });
    }, 0);
  }else{
    addBomRow();
  }
}
function addBomRow(){
  const wrap = document.getElementById('bomRows');
  const rowId = 'bomrow_'+uid();
  const div = document.createElement('div');
  div.className = 'item-row';
  div.id = rowId;
  div.style.gridTemplateColumns = '2.5fr 1fr 34px';
  div.innerHTML = `
    <select class="sel-material">${window._bomMaterialOpts}</select>
    <input class="inp-qty" type="number" min="0" step="0.01" value="1">
    <button class="rm-btn" type="button" onclick="document.getElementById('${rowId}').remove();">${icon('close')}</button>
  `;
  wrap.appendChild(div);
}
function deleteBom(id){
  if(!requirePerm('delete_records','حذف وصفات التصنيع')) return;
  const used = DB.productionOrders.some(o=>o.bomId===id);
  if(used){ toast('لا يمكن حذف وصفة مستخدمة في أوامر تصنيع سابقة'); return; }
  confirmAction('حذف الوصفة', 'هل تريد حذف هذه الوصفة؟', ()=>{
    const b = DB.boms.find(x=>x.id===id);
    DB.boms = DB.boms.filter(x=>x.id!==id);
    persist('boms');
    logActivity('bom', 'حذف وصفة تصنيع: '+(b?b.name:id));
    closeModal(); render(); toast('تم الحذف');
  });
}

function openProductionOrderModal(editId, preselectBomId){
  const o = editId ? DB.productionOrders.find(x=>x.id===editId) : null;
  if(o && o.status!=='pending'){ toast('الأمر ده اتعامل معاه بالفعل - لا يمكن تعديله'); return; }
  const bomOpts = DB.boms.map(b=>`<option value="${b.id}" ${(o?o.bomId===b.id:preselectBomId===b.id)?'selected':''}>${esc(b.name)} (${esc(b.productName)})</option>`).join('');
  const body = `
    <div class="alert-bar">${icon('alert')}<div>أمر التصنيع هيتسجل <b>بانتظار الموافقة</b> ومش هيتحرك المخزون إلا بعد اعتماده.</div></div>
    <div class="field"><label>وصفة التصنيع *</label><select id="f_bom" onchange="updateProductionPreview()">${DB.boms.length?'<option value="">اختر...</option>'+bomOpts:'<option value="">لا توجد وصفات</option>'}</select></div>
    <div class="row2">
      <div class="field"><label>الكمية المطلوب إنتاجها *</label><input id="f_qty" type="number" min="0.01" step="0.01" value="${o?o.producedQty:''}" oninput="updateProductionPreview()"></div>
      <div class="field"><label>التاريخ</label><input id="f_date" type="date" value="${o?o.date:todayISO()}"></div>
    </div>
    <div id="productionPreview" style="margin-top:6px;"></div>
    <div class="row2" style="margin-top:10px;">
      <div class="field"><label>تكلفة عمالة/تشغيل إضافية (اختياري)</label><input id="f_overhead" type="number" min="0" step="0.01" value="${o?o.overheadCost||0:0}" oninput="document.getElementById('overheadCashField').style.display = (parseFloat(this.value)||0)>0 ? 'block' : 'none';"></div>
      <div class="field" id="overheadCashField" style="display:${o&&o.overheadCost>0?'block':'none'};"><label>الخزينة / الحساب البنكي المصروف منه</label><select id="f_overhead_cash">${cashBankOptionsHtml(o?o.overheadCashAccountId:null)}</select></div>
    </div>
    <div class="field" style="margin-top:10px;"><label>ملاحظات</label><input id="f_notes" value="${o?esc(o.notes||''):''}"></div>
  `;
  openModal(o?'تعديل أمر تصنيع':'أمر تصنيع جديد', body, ()=>{
    const bomId = document.getElementById('f_bom').value;
    if(!bomId){ toast('اختر وصفة التصنيع'); return false; }
    const bom = DB.boms.find(x=>x.id===bomId);
    const producedQty = parseFloat(document.getElementById('f_qty').value)||0;
    if(producedQty<=0){ toast('أدخل كمية صحيحة'); return false; }
    const date = document.getElementById('f_date').value || todayISO();
    const notes = document.getElementById('f_notes').value.trim();
    const overheadCost = parseFloat(document.getElementById('f_overhead').value)||0;
    const overheadCashAccountId = overheadCost>0 ? document.getElementById('f_overhead_cash').value : null;
    if(overheadCost>0 && !overheadCashAccountId){ toast('اختر الخزينة المصروف منها تكلفة العمالة/التشغيل'); return false; }
    const multiplier = producedQty / bom.outputQty;
    const materials = bom.items.map(it=>{
      const p = productById(it.materialId);
      const neededQty = it.qty * multiplier;
      return {productId:it.materialId, name:it.name, qty:neededQty, cost:p?p.purchasePrice:0};
    });
    const materialsCost = materials.reduce((s,m)=>s+m.qty*m.cost,0);
    const totalCost = materialsCost + overheadCost;
    const unitCost = producedQty>0 ? totalCost/producedQty : 0;
    if(!checkPeriodLock(date)) return false;
    if(o){
      Object.assign(o, { bomId, bomName:bom.name, producedProductId:bom.productId, producedProductName:bom.productName, date, producedQty, materials, materialsCost, overheadCost, overheadCashAccountId, totalCost, unitCost, notes });
      logActivity('production', 'تعديل أمر تصنيع '+o.number);
    }else{
      const order = { id:uid(), number:nextNumber(DB.productionOrders,'PRD'), bomId, bomName:bom.name, producedProductId:bom.productId, producedProductName:bom.productName, date, producedQty, materials, materialsCost, overheadCost, overheadCashAccountId, totalCost, unitCost, notes, status:'pending', createdAt:Date.now(), createdBy:currentUserName() };
      DB.productionOrders.push(order);
      logActivity('production', 'إنشاء أمر تصنيع '+order.number+' - '+bom.productName+' بكمية '+fmt(producedQty)+' (بانتظار الموافقة)');
    }
    persist('productionOrders');
    closeModal(); render(); toast('تم الحفظ بانتظار الموافقة');
  });
  setTimeout(updateProductionPreview, 0);
}
function updateProductionPreview(){
  const bomId = document.getElementById('f_bom').value;
  const qtyEl = document.getElementById('f_qty');
  const previewEl = document.getElementById('productionPreview');
  if(!previewEl) return;
  if(!bomId){ previewEl.innerHTML = ''; return; }
  const bom = DB.boms.find(x=>x.id===bomId);
  if(!bom){ previewEl.innerHTML = ''; return; }
  const producedQty = parseFloat(qtyEl.value)||0;
  const multiplier = bom.outputQty>0 ? producedQty/bom.outputQty : 0;
  const rows = bom.items.map(it=>{
    const p = productById(it.materialId);
    const needed = it.qty*multiplier;
    const avail = p?p.quantity:0;
    const short = needed>avail+0.001;
    return `<tr><td>${esc(it.name)}</td><td class="tnum">${fmt(needed)}</td><td class="tnum ${short?'':''}" style="${short?'color:var(--danger);font-weight:700;':''}">${fmt(avail)}${short?' (غير كافي!)':''}</td></tr>`;
  }).join('');
  const totalCost = bom.items.reduce((s,it)=>{ const p=productById(it.materialId); return s+it.qty*multiplier*(p?p.purchasePrice:0); },0);
  previewEl.innerHTML = `
    <label>المواد الخام المطلوبة (محسوبة تلقائياً)</label>
    <div class="table-wrap"><table>
      <thead><tr><th>المادة الخام</th><th>الكمية المطلوبة</th><th>المتاح بالمخزون</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="tot-line grand" style="margin-top:8px;"><span>التكلفة الإجمالية التقديرية</span><span class="tnum">${money(totalCost)}</span></div>
  `;
}

function approveProductionOrder(id){
  if(!requirePerm('approve_expenses','اعتماد أوامر التصنيع')) return;
  const o = DB.productionOrders.find(x=>x.id===id);
  if(!o || o.status!=='pending') return;
  if(!checkPeriodLock(o.date)) return;
  for(const m of o.materials){
    const p = productById(m.productId);
    if(!p || m.qty>p.quantity+0.001){ toast('لا يمكن الاعتماد: الكمية المطلوبة من "'+m.name+'" أكبر من المتاح بالمخزون حالياً'); return; }
  }
  confirmAction('اعتماد أمر التصنيع', 'سيتم خصم المواد الخام وإضافة المنتج الجاهز للمخزون فوراً. هل أنت متأكد؟', ()=>{
    o.status = 'approved'; o.approvedBy = currentUserName(); o.approvedAt = Date.now();
    persist('productionOrders');
    o.materials.forEach(m=>{
      const p = productById(m.productId);
      p.quantity -= m.qty;
      logStockMove(m.productId, -m.qty, 'production_consume', o.number, 'استهلاك في تصنيع '+o.producedProductName);
    });
    const finished = productById(o.producedProductId);
    finished.purchasePrice = o.unitCost;
    finished.quantity = finished.quantity + o.producedQty;
    logStockMove(o.producedProductId, o.producedQty, 'production_output', o.number, 'ناتج تصنيع - '+o.bomName);
    persist('products');
    if(o.overheadCost>0 && o.overheadCashAccountId){
      postJournal(o.date, 'تكلفة عمالة/تشغيل - أمر تصنيع '+o.number, [
        {accountId:'acc_inventory', debit:o.overheadCost, credit:0},
        {accountId:o.overheadCashAccountId, debit:0, credit:o.overheadCost},
      ], 'production', o.id);
    }
    logActivity('production', 'اعتماد أمر تصنيع '+o.number+' - إنتاج '+fmt(o.producedQty)+' من '+o.producedProductName);
    closeModal(); render(); toast('تم الاعتماد بنجاح - تم تحديث المخزون وتكلفة المنتج');
  });
}
function rejectProductionOrder(id){
  if(!requirePerm('approve_expenses','رفض أوامر التصنيع')) return;
  const o = DB.productionOrders.find(x=>x.id===id);
  if(!o || o.status!=='pending') return;
  confirmAction('رفض أمر التصنيع', 'هل تريد رفض هذا الأمر؟', ()=>{
    o.status = 'rejected'; o.rejectedBy = currentUserName(); o.rejectedAt = Date.now();
    persist('productionOrders');
    logActivity('production', 'رفض أمر تصنيع '+o.number);
    closeModal(); render(); toast('تم الرفض');
  });
}
function deleteProductionOrder(id){
  if(!requirePerm('delete_invoices','حذف أوامر التصنيع')) return;
  const o = DB.productionOrders.find(x=>x.id===id);
  if(!o) return;
  const isApproved = o.status==='approved';
  if(isApproved && !checkPeriodLock(o.date)) return;
  confirmAction('حذف أمر التصنيع', isApproved?'الأمر ده معتمد بالفعل - سيتم إرجاع المواد الخام وخصم الكمية المنتجة من المخزون'+(o.overheadCost>0?' وعكس قيد تكلفة العمالة/التشغيل':'')+'. هل أنت متأكد؟':'هل تريد حذف هذا الأمر؟', ()=>{
    if(isApproved){
      if(o.overheadCost>0) removeJournalBySource(o.id);
      o.materials.forEach(m=>{
        const p = productById(m.productId);
        if(p){ p.quantity += m.qty; logStockMove(m.productId, m.qty, 'production_reverse', o.number, 'إلغاء أمر تصنيع - إرجاع مادة خام'); }
      });
      const finished = productById(o.producedProductId);
      if(finished){ finished.quantity -= o.producedQty; logStockMove(o.producedProductId, -o.producedQty, 'production_reverse', o.number, 'إلغاء أمر تصنيع - خصم المنتج الناتج'); }
      persist('products');
    }
    DB.productionOrders = DB.productionOrders.filter(x=>x.id!==id);
    persist('productionOrders');
    logActivity('production', 'حذف أمر تصنيع '+o.number);
    closeModal(); render(); toast('تم الحذف');
  });
}
/* ============ LANDED COSTS (الشحن والتكاليف الإضافية) ============ */

function openLandedCostModal(editId){
  const l = editId ? DB.landedCosts.find(x=>x.id===editId) : null;
  if(l && l.status!=='pending'){ toast('الأمر ده اتعامل معاه بالفعل - لا يمكن تعديله'); return; }
  const purchaseOpts = DB.purchases.map(p=>`<option value="${p.id}" ${l&&l.purchaseId===p.id?'selected':''}>${p.number} - ${esc(p.partyName)} (${fmtDate(p.date)})</option>`).join('');
  window._landedProductOpts = DB.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  const body = `
    <div class="alert-bar">${icon('alert')}<div>هيتسجل <b>بانتظار الموافقة</b>، وتكلفة المنتجات مش هتتحدّث إلا بعد الاعتماد.</div></div>
    <div class="row2">
      <div class="field"><label>مرتبط بفاتورة شراء *</label><select id="f_purchase" onchange="loadPurchaseIntoLandedCost()">${DB.purchases.length?'<option value="">اختر فاتورة الشراء...</option>'+purchaseOpts:'<option value="">لا توجد فواتير شراء - سجّل فاتورة شراء أولاً</option>'}</select></div>
      <div class="field"><label>التاريخ</label><input id="f_date" type="date" value="${l?l.date:todayISO()}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>إجمالي مبلغ الشحن/التكلفة *</label><input id="f_amount" type="number" min="0" step="0.01" value="${l?l.totalAmount:0}" oninput="updateLandedCostPreview()"></div>
      <div class="field"><label>طريقة التوزيع</label><select id="f_method" onchange="updateLandedCostPreview()">
        <option value="value" ${!l||l.method==='value'?'selected':''}>حسب قيمة كل منتج</option>
        <option value="qty" ${l&&l.method==='qty'?'selected':''}>حسب الكمية</option>
      </select></div>
    </div>
    <div class="field"><label>الخزينة / الحساب البنكي المصروف منه</label><select id="f_cashacc">${cashBankOptionsHtml(l?l.cashAccountId:null)}</select></div>
    <label>المنتجات المتأثرة</label>
    <div class="item-rows" id="landedRows">
      <div class="item-row head-row" style="grid-template-columns:2fr 1fr 34px;"><div>المنتج</div><div>الكمية المتأثرة</div><div></div></div>
    </div>
    <button class="btn btn-outline btn-sm" type="button" onclick="addLandedCostRow()">${icon('plus')} إضافة منتج</button>
    <div id="landedCostPreview" style="margin-top:10px;"></div>
    <div class="field" style="margin-top:10px;"><label>ملاحظات</label><input id="f_notes" value="${l?esc(l.notes||''):''}" placeholder="مثال: شحنة بحري من الصين - أغسطس"></div>
  `;
  openModal(l?'تعديل تكلفة شحن':'تكلفة شحن جديدة', body, ()=>{
    const purchaseId = document.getElementById('f_purchase').value || null;
    if(!purchaseId){ toast('اختر فاتورة الشراء المرتبطة بالشحنة أولاً'); return false; }
    const date = document.getElementById('f_date').value || todayISO();
    const totalAmount = parseFloat(document.getElementById('f_amount').value)||0;
    if(totalAmount<=0){ toast('أدخل مبلغ صحيح'); return false; }
    const method = document.getElementById('f_method').value;
    const cashAcc = document.getElementById('f_cashacc').value;
    const notes = document.getElementById('f_notes').value.trim();
    const rows = Array.from(document.querySelectorAll('#landedRows .item-row:not(.head-row)'));
    const items = [];
    rows.forEach(row=>{
      const sel = row.querySelector('.sel-product');
      if(!sel.value) return;
      const p = productById(sel.value);
      const qty = parseFloat(row.querySelector('.inp-qty').value)||0;
      if(qty<=0) return;
      items.push({productId:p.id, name:p.name, qty, originalValue:qty*(p.purchasePrice||0)});
    });
    if(items.length===0){ toast('أضف منتج واحد على الأقل'); return false; }
    if(!checkPeriodLock(date)) return false;
    if(l){
      Object.assign(l, {purchaseId, date, totalAmount, method, cashAccountId:cashAcc, items, notes});
      logActivity('landedcost', 'تعديل تكلفة شحن '+l.number);

      DB.landedCosts.push(rec);
      logActivity('landedcost', 'إنشاء تكلفة شحن '+rec.number+' بمبلغ '+money(totalAmount)+' (بانتظار الموافقة)');
    }
    persist('landedCosts');
    closeModal(); render(); toast('تم الحفظ بانتظار الموافقة');

  if(l && l.items.length){
    l.items.forEach(()=>addLandedCostRow());
    setTimeout(()=>{
      const rows = document.querySelectorAll('#landedRows .item-row:not(.head-row)');
      l.items.forEach((it,i)=>{
        const row = rows[i]; if(!row) return;
        row.querySelector('.sel-product').value = it.productId;
        row.querySelector('.inp-qty').value = it.qty;
      });
      updateLandedCostPreview();
    }, 0);
  }else{
    addLandedCostRow();
    setTimeout(updateLandedCostPreview, 0);

function addLandedCostRow(){
  const wrap = document.getElementById('landedRows');
  const rowId = 'lcrow_'+uid();
  const div = document.createElement('div');
  div.className = 'item-row';
  div.id = rowId;
  div.style.gridTemplateColumns = '2fr 1fr 34px';

    <button class="rm-btn" type="button" onclick="document.getElementById('${rowId}').remove(); updateLandedCostPreview();">${icon('close')}</button>

}
function loadPurchaseIntoLandedCost(){
  const purchaseId = document.getElementById('f_purchase').value;
  if(!purchaseId) return;
  const purch = DB.purchases.find(x=>x.id===purchaseId);
  if(!purch) return;
  document.getElementById('landedRows').innerHTML = '<div class="item-row head-row" style="grid-template-columns:2fr 1fr 34px;"><div>المنتج</div><div>الكمية المتأثرة</div><div></div></div>';
  purch.items.forEach(()=>addLandedCostRow());
  setTimeout(()=>{
    const rows = document.querySelectorAll('#landedRows .item-row:not(.head-row)');
    purch.items.forEach((it,i)=>{
      const row = rows[i]; if(!row) return;
      row.querySelector('.sel-product').value = it.productId;
      row.querySelector('.inp-qty').value = it.qty;
    });
    updateLandedCostPreview();
  }, 0);
}
function computeLandedAllocation(items, totalAmount, method){
  const basis = items.map(it=>{
    const p = productById(it.productId);
    return method==='qty' ? it.qty : it.qty*(p?p.purchasePrice:0);
  });
  const totalBasis = basis.reduce((s,b)=>s+b,0);
  return items.map((it,i)=>{
    const allocated = totalBasis>0 ? (basis[i]/totalBasis)*totalAmount : 0;
    return {...it, allocated, unitAdd: it.qty>0 ? allocated/it.qty : 0};
  });
}
function updateLandedCostPreview(){
  const previewEl = document.getElementById('landedCostPreview');
  if(!previewEl) return;
  const totalAmount = parseFloat(document.getElementById('f_amount').value)||0;
  const method = document.getElementById('f_method').value;
  const rows = Array.from(document.querySelectorAll('#landedRows .item-row:not(.head-row)'));
  const items = [];
  rows.forEach(row=>{
    const sel = row.querySelector('.sel-product');
    if(!sel.value) return;
    const p = productById(sel.value);
    const qty = parseFloat(row.querySelector('.inp-qty').value)||0;
    if(qty<=0 || !p) return;
    items.push({productId:p.id, name:p.name, qty, currentCost:p.purchasePrice||0});
  });
  if(items.length===0 || totalAmount<=0){ previewEl.innerHTML=''; return; }
  const allocated = computeLandedAllocation(items, totalAmount, method);
  previewEl.innerHTML = `
    <label>معاينة التوزيع (تقديري)</label>
    <div class="table-wrap"><table>
      <thead><tr><th>المنتج</th><th>الكمية</th><th>نصيبه من التكلفة</th><th>سعر الشراء الحالي</th><th>السعر الجديد المتوقع</th></tr></thead>
      <tbody>${allocated.map(it=>`<tr><td>${esc(it.name)}</td><td class="tnum">${fmt(it.qty)}</td><td class="tnum">${money(it.allocated)}</td><td class="tnum">${money(it.currentCost)}</td><td class="tnum" style="font-weight:700;color:var(--success);">${money(it.currentCost+it.unitAdd)}</td></tr>`).join('')}</tbody>
    </table></div>
  `;
}

  const allocated = computeLandedAllocation(l.items, l.totalAmount, l.method);
  const statusBadge = l.status==='pending' ? '<span class="badge partial">بانتظار الموافقة</span>' : l.status==='rejected' ? '<span class="badge unpaid">مرفوض</span>' : '<span class="badge paid">معتمد</span>';

      <thead><tr><th>المنتج</th><th>الكمية</th><th>نصيبه من التكلفة</th><th>إضافة لسعر الوحدة</th></tr></thead>
      <tbody>${allocated.map(it=>`<tr><td>${esc(it.name)}</td><td class="tnum">${fmt(it.qty)}</td><td class="tnum">${money(it.allocated)}</td><td class="tnum">${money(it.unitAdd)}</td></tr>`).join('')}</tbody>
    </table></div>

function approveLandedCost(id){
  if(!requirePerm('approve_expenses','اعتماد تكاليف الشحن')) return;
  const l = DB.landedCosts.find(x=>x.id===id);
  if(!l || l.status!=='pending') return;
  if(!checkPeriodLock(l.date)) return;
  confirmAction('اعتماد تكلفة الشحن', 'سيتم توزيع المبلغ على تكلفة المنتجات وترحيل القيد المحاسبي فوراً. هل أنت متأكد؟', ()=>{
    l.status = 'approved'; l.approvedBy = currentUserName(); l.approvedAt = Date.now();
    persist('landedCosts');
    const allocated = computeLandedAllocation(l.items, l.totalAmount, l.method);
    allocated.forEach(it=>{
      const p = productById(it.productId);
      if(p) p.purchasePrice = (p.purchasePrice||0) + it.unitAdd;
    });
    persist('products');
    postJournal(l.date, 'تكلفة شحن/نقل '+l.number+(l.notes?' - '+l.notes:''), [
      {accountId:'acc_inventory', debit:l.totalAmount, credit:0},
      {accountId:l.cashAccountId, debit:0, credit:l.totalAmount},
    ], 'landedcost', l.id);
    logActivity('landedcost', 'اعتماد تكلفة شحن '+l.number+' بمبلغ '+money(l.totalAmount));
    closeModal(); render(); toast('تم الاعتماد بنجاح - تم تحديث تكلفة المنتجات');
  });
}
function rejectLandedCost(id){
  if(!requirePerm('approve_expenses','رفض تكاليف الشحن')) return;
  const l = DB.landedCosts.find(x=>x.id===id);
  if(!l || l.status!=='pending') return;
  confirmAction('رفض تكلفة الشحن', 'هل تريد رفض هذا الأمر؟', ()=>{
    l.status = 'rejected'; l.rejectedBy = currentUserName(); l.rejectedAt = Date.now();
    persist('landedCosts');
    logActivity('landedcost', 'رفض تكلفة شحن '+l.number);
    closeModal(); render(); toast('تم الرفض');
  });
}
function deleteLandedCost(id){
  if(!requirePerm('delete_invoices','حذف تكاليف الشحن')) return;
  const l = DB.landedCosts.find(x=>x.id===id);
  if(!l) return;
  const isApproved = l.status==='approved';
  if(isApproved && !checkPeriodLock(l.date)) return;
  confirmAction('حذف تكلفة الشحن', isApproved?'الأمر ده معتمد بالفعل - سيتم عكس القيد المحاسبي، لكن تعديل أسعار المنتجات لن يُعاد تلقائياً (راجعها يدوياً لو محتاج). هل أنت متأكد؟':'هل تريد حذف هذا الأمر؟', ()=>{
    if(isApproved) removeJournalBySource(l.id);
    DB.landedCosts = DB.landedCosts.filter(x=>x.id!==id);
    persist('landedCosts');
    logActivity('landedcost', 'حذف تكلفة شحن '+l.number);
    closeModal(); render(); toast('تم الحذف');
  });
}

function deleteWarehouse(id){
  if(!requirePerm('manage_settings','حذف المخازن')) return;
  const hasStock = DB.products.some(p=>p.stockByWarehouse && (p.stockByWarehouse[id]||0)>0.001);
  if(hasStock){ toast('لا يمكن حذف مخزن به رصيد بضاعة - حوّل البضاعة أولاً'); return; }
  confirmAction('حذف المخزن', 'هل تريد حذف هذا المخزن؟', ()=>{
    DB.warehouses = DB.warehouses.filter(x=>x.id!==id);
    persist('warehouses');
    closeModal(); openWarehousesModal(); toast('تم الحذف');
  });

function openStockTransferModal(){
  const productOpts = DB.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  const whOpts = DB.warehouses.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('');
  const body = `
    <div class="field"><label>المنتج</label><select id="f_prod" onchange="updateTransferAvail()">${productOpts}</select></div>
    <div class="row2">
      <div class="field"><label>من مخزن</label><select id="f_from" onchange="updateTransferAvail()">${whOpts}</select></div>
      <div class="field"><label>إلى مخزن</label><select id="f_to">${whOpts}</select></div>
    </div>
    <div class="field"><label>الكمية المتاحة بالمخزن المصدر: <b id="transferAvail">0</b></label><input id="f_qty" type="number" min="0" step="1" value="0"></div>
  `;
  openModal('تحويل مخزون بين المخازن', body, ()=>{
    const pid = document.getElementById('f_prod').value;
    const from = document.getElementById('f_from').value;
    const to = document.getElementById('f_to').value;
    const qty = parseFloat(document.getElementById('f_qty').value)||0;
    if(from===to){ toast('اختر مخزنين مختلفين'); return false; }
    if(qty<=0){ toast('أدخل كمية صحيحة'); return false; }
    const p = productById(pid);
    ensureWarehouseInit(p);
    const avail = p.stockByWarehouse[from]||0;
    if(qty>avail){ toast('الكمية المطلوبة أكبر من المتاح بالمخزن المصدر'); return false; }
    p.stockByWarehouse[from] = avail - qty;
    p.stockByWarehouse[to] = (p.stockByWarehouse[to]||0) + qty;
    persist('products');
    const fromName = DB.warehouses.find(w=>w.id===from).name, toName = DB.warehouses.find(w=>w.id===to).name;
    logStockMove(pid, 0, 'warehouse_transfer', '-', 'تحويل '+fmt(qty)+' من '+fromName+' إلى '+toName);
    logActivity('warehouse', 'تحويل '+fmt(qty)+' من "'+p.name+'" من '+fromName+' إلى '+toName);
    closeModal(); render(); toast('تم التحويل بنجاح');
  });
  setTimeout(updateTransferAvail, 0);
}
function updateTransferAvail(){
  const pid = document.getElementById('f_prod').value;
  const from = document.getElementById('f_from').value;
  const p = productById(pid);
  if(!p) return;
  ensureWarehouseInit(p);
  const el = document.getElementById('transferAvail');
  if(el) el.textContent = fmt(p.stockByWarehouse[from]||0);
}

  const body = `
